<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover,maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>苍穹仙途 · 水墨修真</title>
<style>
:root{--p:#f5f0e4;--i:#1a1a1a;--i2:#555;--g:#b8860b;--r:#c41e3a;--j:#5a8a6a;--pp:#6a3a8a}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:var(--p);touch-action:none;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;
  font-family:'STKaiti','KaiTi','STSong','Songti SC','Noto Serif SC',serif;}
#app{width:100%;height:100%;max-width:500px;max-height:920px;margin:0 auto;
  background:radial-gradient(ellipse at 50% 20%,#faf6ed,#ede3d0 45%,#d8ccb4 100%);
  box-shadow:0 0 80px rgba(0,0,0,.12);position:relative;overflow:hidden;display:flex;flex-direction:column;}
canvas{position:absolute;top:0;left:0;width:100%;height:100%;z-index:0;display:block;}

/* SCREENS */
.scr{position:absolute;top:0;left:0;right:0;bottom:0;z-index:5;display:flex;flex-direction:column;
  overflow-y:auto;pointer-events:none;opacity:0;transition:opacity .2s;}
.scr.on{z-index:10;pointer-events:all;opacity:1;}
.scr.off{display:none;}

/* TITLE - redesigned */
#titlescr{background:rgba(245,240,228,.88);justify-content:center;align-items:center;text-align:center;}
.title-hero{width:100px;height:130px;margin:0 auto 8px;position:relative;}
.t4{font-size:44px;font-weight:bold;color:var(--i);letter-spacing:8px;margin-bottom:2px;}
.t4 span{display:inline-block;animation:tf 2.5s ease-in-out infinite;}
.t4 span:nth-child(1){animation-delay:0s}.t4 span:nth-child(2){animation-delay:.12s}
.t4 span:nth-child(3){animation-delay:.24s}.t4 span:nth-child(4){animation-delay:.36s}
@keyframes tf{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
.sub{font-size:14px;color:var(--i2);letter-spacing:6px;margin-bottom:4px;}
.divider{width:50px;height:1px;background:var(--i);margin:12px auto 18px;opacity:.3;}
.btns{display:flex;flex-direction:column;gap:8px;width:190px;}
.btn{font-family:inherit;font-size:15px;font-weight:bold;padding:10px;border:1.5px solid var(--i);
  background:transparent;color:var(--i);letter-spacing:3px;cursor:pointer;border-radius:4px;transition:all .15s;}
.btn:active{background:var(--i);color:var(--p);}
.btn.ink{background:var(--i);color:var(--p);}
.btn.ink:active{background:var(--r);border-color:var(--r);}
.btn.gold{border-color:var(--g);color:var(--g);}
.btn.gold:active{background:var(--g);color:var(--p);}
.btn.sm{font-size:11px;padding:6px;letter-spacing:2px;}
.stones{display:flex;align-items:center;gap:6px;margin-top:16px;font-size:13px;color:var(--g);letter-spacing:1px;}

/* HUD - HP at top */
#hud{position:absolute;top:0;left:0;right:0;z-index:6;pointer-events:none;padding:8px 12px;}
#hud.off{display:none;}
.rw{display:flex;justify-content:space-between;align-items:center;margin-bottom:1px;}
.hi{display:flex;flex-direction:column;}
.hl{font-size:9px;color:var(--i2);letter-spacing:2px;}
.hv{font-size:18px;font-weight:bold;color:var(--i);line-height:1.1;}
.hv.g{color:var(--g);}
/* HP bar in HUD */
#hp-bar{height:3px;background:rgba(0,0,0,.07);border-radius:1.5px;margin-top:4px;overflow:hidden;}
#hp-fill{height:100%;background:var(--r);border-radius:1.5px;transition:width .3s;width:100%;}
/* Qi bar in HUD */
#qi-bar{height:2px;background:rgba(0,0,0,.04);border-radius:1px;margin-top:2px;overflow:hidden;}
#qi-fill{height:100%;background:var(--g);border-radius:1px;transition:width .3s;width:0%;}

#pause-btn{position:absolute;top:6px;right:10px;z-index:7;pointer-events:all;
  font-family:inherit;font-size:18px;background:rgba(0,0,0,.06);border:none;width:30px;height:30px;
  border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--i);}
#pause-btn.off{display:none;}
#pw-timer{position:absolute;top:40px;right:10px;z-index:7;pointer-events:none;
  font-size:11px;font-weight:bold;color:var(--r);letter-spacing:1px;}
#pw-timer.off{display:none;}
#combo{text-align:center;font-size:15px;font-weight:bold;opacity:0;transition:opacity .15s;margin-top:2px;}
#combo.on{opacity:1;}#combo.s{color:var(--g);}#combo.ss{color:var(--r);animation:pls .5s infinite;}
@keyframes pls{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
#nf-c{position:absolute;top:50px;left:50%;transform:translateX(-50%);z-index:20;pointer-events:none;display:flex;flex-direction:column;align-items:center;gap:6px;}
.nf{background:rgba(26,26,26,.92);color:var(--p);padding:8px 16px;border-radius:6px;font-size:12px;letter-spacing:2px;animation:nfi .4s,nfo .4s 2s ease-in forwards;max-width:240px;text-align:center;}
.nf.g{border:1px solid var(--g);}.nf.r{border:1px solid var(--r);}
@keyframes nfi{0%{opacity:0;transform:translateY(-16px)}100%{opacity:1;transform:translateY(0)}}
@keyframes nfo{0%{opacity:1}100%{opacity:0;transform:translateY(-10px)}}

/* PANELS */
.ph{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid rgba(0,0,0,.07);flex-shrink:0;}
.pt{font-size:19px;font-weight:bold;color:var(--i);letter-spacing:4px;}
.pback{font-family:inherit;font-size:13px;background:none;border:none;color:var(--i2);cursor:pointer;letter-spacing:2px;}
.pback:active{color:var(--i);}
.pbd{padding:12px 16px;flex:1;overflow-y:auto;}
.stabs{display:flex;border-bottom:1px solid rgba(0,0,0,.07);flex-shrink:0;}
.stab{flex:1;font-family:inherit;font-size:12px;padding:8px;background:none;border:none;color:var(--i2);cursor:pointer;letter-spacing:2px;}
.stab.on{color:var(--i);font-weight:bold;border-bottom:2px solid var(--i);}
.si{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid rgba(0,0,0,.04);flex-shrink:0;}
.sn{font-size:13px;font-weight:bold;color:var(--i);}.sd{font-size:9px;color:var(--i2);margin-top:1px;}
.sc{font-size:12px;color:var(--g);font-weight:bold;margin-right:8px;white-space:nowrap;}
.sb{font-family:inherit;font-size:10px;padding:4px 10px;border:1px solid var(--g);background:transparent;color:var(--g);cursor:pointer;border-radius:3px;letter-spacing:1px;white-space:nowrap;}
.sb:active{background:var(--g);color:#fff;}.sb.ok{color:var(--j);border-color:var(--j);}
.slv{font-size:9px;color:var(--i2);margin-left:2px;}
.cg{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
.cc{border:1px solid rgba(0,0,0,.07);border-radius:8px;padding:12px 6px;text-align:center;transition:all .2s;}
.cc.lk{opacity:.4;filter:grayscale(1);}
.cc.own{border-color:var(--g);background:rgba(184,134,11,.04);cursor:pointer;}
.cc.eq{border-color:var(--r);background:rgba(196,30,58,.05);}
.ci{font-size:32px;margin-bottom:5px;}.cn{font-size:11px;font-weight:bold;color:var(--i);}.cd{font-size:9px;color:var(--i2);margin-top:1px;}
.ai{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid rgba(0,0,0,.04);flex-shrink:0;}
.ai.lk{opacity:.4;filter:grayscale(1);}
.aico{font-size:24px;min-width:30px;text-align:center;}
.an{font-size:12px;font-weight:bold;color:var(--i);}.ad{font-size:9px;color:var(--i2);}.arw{font-size:10px;color:var(--g);}
.lbtabs{display:flex;border-bottom:1px solid rgba(0,0,0,.07);flex-shrink:0;}
.lbtab{flex:1;font-family:inherit;font-size:11px;padding:7px;background:none;border:none;color:var(--i2);cursor:pointer;letter-spacing:1px;}
.lbtab.on{color:var(--i);font-weight:bold;border-bottom:2px solid var(--i);}
.lbi{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid rgba(0,0,0,.03);}
.lbr{font-size:14px;font-weight:bold;width:24px;text-align:center;}.lbr.top{color:var(--g);}
.lbs{font-size:16px;font-weight:bold;color:var(--i);flex:1;text-align:right;}.lbd{font-size:8px;color:var(--i2);}
.sr{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid rgba(0,0,0,.04);}
.sl{font-size:13px;color:var(--i);}.sld{font-size:9px;color:var(--i2);}
.tg{width:44px;height:24px;background:#ccc;border-radius:12px;position:relative;cursor:pointer;transition:background .2s;flex-shrink:0;}
.tg.on{background:var(--j);}
.tg::after{content:'';position:absolute;top:2px;left:2px;width:20px;height:20px;background:#fff;border-radius:50%;transition:left .2s;box-shadow:0 1px 3px rgba(0,0,0,.2);}
.tg.on::after{left:22px;}
.dbtn{font-family:inherit;font-size:11px;padding:6px 12px;border:1px solid var(--r);background:transparent;color:var(--r);cursor:pointer;border-radius:4px;letter-spacing:1px;}
.dbtn:active{background:var(--r);color:#fff;}
.rbox{text-align:center;padding:16px;width:100%;}
.rt{font-size:28px;font-weight:bold;letter-spacing:5px;color:var(--i);}.rt.w{color:var(--g);}
.rs{font-size:48px;font-weight:bold;color:var(--i);margin:6px 0;}
.rstats{display:flex;justify-content:center;gap:18px;margin:12px 0;flex-wrap:wrap;}
.rst{text-align:center;}.rstv{font-size:16px;font-weight:bold;color:var(--g);}.rstl{font-size:9px;color:var(--i2);}
.rss{font-size:16px;color:var(--g);margin:6px 0;font-weight:bold;}
.rbtns{display:flex;flex-direction:column;gap:8px;align-items:center;margin-top:12px;}
#pause-ol{position:absolute;top:0;left:0;right:0;bottom:0;z-index:8;background:rgba(245,240,228,.85);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;}
#pause-ol.hidden{display:none;}
.pause-tt{font-size:26px;font-weight:bold;color:var(--i);letter-spacing:5px;margin-bottom:8px;}
.toast{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:30;font-size:52px;pointer-events:none;animation:tp .8s ease-out forwards;}
@keyframes tp{0%{opacity:0;transform:translate(-50%,-50%) scale(.3)}30%{opacity:1;transform:translate(-50%,-50%) scale(1.2)}100%{opacity:0;transform:translate(-50%,-50%) scale(1.5)}}
@media(max-width:380px){.t4{font-size:36px}.btn{font-size:14px;padding:9px}.rs{font-size:38px}}
</style>
</head>
<body>
<div id="app">
<canvas id="c"></canvas>

<div id="hud" class="off">
  <div class="rw"><div class="hi"><span class="hl">得分</span><span class="hv" id="h-score">0</span></div><div class="hi" style="align-items:flex-end"><span class="hl" id="h-mode">闯关</span><span class="hv g" id="h-wave">第1波</span></div></div>
  <div id="hp-bar"><div id="hp-fill"></div></div>
  <div class="rw" style="margin-top:3px"><div class="hi"><span class="hl">灵石</span><span class="hv g" id="h-stones">+0</span></div><div class="hi" style="align-items:flex-end"><span class="hl">击杀</span><span class="hv" id="h-kills">0</span></div></div>
  <div id="qi-bar"><div id="qi-fill"></div></div>
  <div id="combo"></div>
</div>
<button id="pause-btn" class="off" data-action="pause">⏸</button>
<div id="pw-timer" class="off"></div>
<div id="nf-c"></div>

<div id="pause-ol" class="hidden">
  <div class="pause-tt">暂停</div>
  <button class="btn ink" data-action="resume">继续</button>
  <button class="btn" data-action="restart">重来</button>
  <button class="btn" data-action="home">回主页</button>
</div>

<div class="scr on" id="titlescr">
  <div style="flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;">
    <div class="title-hero" id="title-hero"></div>
    <div class="t4"><span>苍</span><span>穹</span><span>仙</span><span>途</span></div>
    <div class="sub">CULTIVATION SKY</div>
    <div class="divider"></div>
    <div class="btns">
      <button class="btn ink" data-action="stage">⚔️ 闯关模式</button>
      <button class="btn" data-action="score">🏆 得分模式</button>
      <button class="btn gold" data-action="shop">🏪 仙坊</button>
      <button class="btn" data-action="collection">📜 法宝图鉴</button>
      <button class="btn" data-action="achievements">🎖 成就</button>
      <button class="btn" data-action="leaderboard">📊 排行榜</button>
      <button class="btn sm" data-action="settings">⚙️ 设置</button>
    </div>
    <div class="stones">💎 <span id="t-stones">0</span> 灵石</div>
  </div>
</div>

<div class="scr off" id="shopscr" style="background:rgba(245,240,228,.96);">
  <div class="ph"><button class="pback" data-action="back">← 返回</button><span class="pt">仙坊</span><span style="color:var(--g);font-size:12px">💎 <span id="s-stones">0</span></span></div>
  <div class="stabs"><button class="stab on" data-tab="upgrade">修为提升</button><button class="stab" data-tab="artifact">法宝购买</button></div>
  <div class="pbd" id="shop-list"></div>
</div>

<div class="scr off" id="collectionscr" style="background:rgba(245,240,228,.96);">
  <div class="ph"><button class="pback" data-action="back">← 返回</button><span class="pt">法宝图鉴</span><span style="font-size:10px;color:var(--i2)" id="cc-count"></span></div>
  <div class="pbd"><div class="cg" id="coll-grid"></div></div>
</div>

<div class="scr off" id="achievementsscr" style="background:rgba(245,240,228,.96);">
  <div class="ph"><button class="pback" data-action="back">← 返回</button><span class="pt">成就</span><span style="font-size:10px;color:var(--i2)" id="ac-count"></span></div>
  <div class="pbd" id="ac-list"></div>
</div>

<div class="scr off" id="leaderboardscr" style="background:rgba(245,240,228,.96);">
  <div class="ph"><button class="pback" data-action="back">← 返回</button><span class="pt">排行榜</span></div>
  <div class="lbtabs"><button class="lbtab on" data-mode="score">得分模式</button><button class="lbtab" data-mode="stage">闯关模式</button></div>
  <div class="pbd"><div id="lb-list"></div></div>
</div>

<div class="scr off" id="settingsscr" style="background:rgba(245,240,228,.96);">
  <div class="ph"><button class="pback" data-action="back">← 返回</button><span class="pt">设置</span></div>
  <div class="pbd">
    <div class="sr"><div><div class="sl">🔊 音效</div><div class="sld">所有游戏音效</div></div><div class="tg on" id="tg-sfx" data-key="sfx"></div></div>
    <div class="sr"><div><div class="sl">🎵 背景音乐</div><div class="sld">五声音阶修仙BGM</div></div><div class="tg on" id="tg-bgm" data-key="bgm"></div></div>
    <div class="sr"><div><div class="sl">💾 数据</div><div class="sld">自动存至浏览器</div></div><span style="font-size:9px;color:var(--j)">✓ 已启用</span></div>
    <div class="sr"><div><div class="sl">🗑️ 清除</div><div class="sld">重置全部进度</div></div><button class="dbtn" id="btn-clear">清除</button></div>
    <div style="text-align:center;margin-top:20px;font-size:9px;color:var(--i2)">🖌️ v6 · 数据本地存储</div>
  </div>
</div>

<div class="scr off" id="goscr" style="background:rgba(245,240,228,.92);justify-content:center;align-items:center;">
  <div class="rbox"><div class="rt" id="go-title">修士陨落</div><div style="font-size:12px;color:var(--i2);margin-top:4px">最终得分</div><div class="rs" id="go-score">0</div><div class="rstats"><div class="rst"><div class="rstv" id="go-kills">0</div><div class="rstl">击杀</div></div><div class="rst"><div class="rstv" id="go-combo">0</div><div class="rstl">最高连击</div></div><div class="rst"><div class="rstv" id="go-wave">0</div><div class="rstl">波次</div></div></div><div class="rss" id="go-stones">💎 +0 灵石</div><div class="rbtns"><button class="btn ink" data-action="retry">再战</button><button class="btn" data-action="home">返回</button></div></div>
</div>

<div class="scr off" id="scscr" style="background:rgba(245,240,228,.92);justify-content:center;align-items:center;">
  <div class="rbox"><div class="rt w">道心突破</div><div style="font-size:14px;color:var(--i);margin-top:4px" id="sc-name"></div><div class="rs" style="font-size:34px;color:var(--g)" id="sc-score">通关！</div><div class="rstats"><div class="rst"><div class="rstv" id="sc-kills">0</div><div class="rstl">击杀</div></div><div class="rst"><div class="rstv" id="sc-combo">0</div><div class="rstl">最高连击</div></div><div class="rst"><div class="rstv" id="sc-hp">0</div><div class="rstl">剩余生命</div></div></div><div class="rss" id="sc-stones">💎 +0 灵石</div><div class="rbtns"><button class="btn ink" data-action="nextstage" id="btn-ns">下一关</button><button class="btn" data-action="home">返回</button></div></div>
</div>
</div>

<script>
// ═══════════════════════════════════════════════
//  苍穹仙途 v6 · Cultivation Sky Shooter
// ═══════════════════════════════════════════════
const $=id=>document.getElementById(id);
const C=$('c'),cx=C.getContext('2d');
let W,H,DPR;
function rs(){
  const r=$('app').getBoundingClientRect();W=r.width;H=r.height;
  DPR=Math.min(window.devicePixelRatio||1,2);
  C.width=W*DPR;C.height=H*DPR;cx.setTransform(DPR,0,0,DPR,0,0);
}
window.addEventListener('resize',rs);rs();

// ═══ DATA ════════════════════════════════════
const STAGES=[{n:'炼气期',w:5,bh:20,us:0},{n:'筑基期',w:7,bh:35,us:0},{n:'金丹期',w:9,bh:55,us:0},{n:'元婴期',w:11,bh:80,us:500},{n:'化神期',w:13,bh:120,us:1500},{n:'炼虚期',w:15,bh:170,us:4000},{n:'合体期',w:17,bh:240,us:8000},{n:'大乘期',w:20,bh:330,us:15000},{n:'渡劫飞升',w:25,bh:500,us:30000}];

let AC=null,audioReady=false;
function ia(){
  if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)();}catch(e){console.log('AC create fail:',e);}}
  if(AC&&AC.state==='suspended'){AC.resume().then(()=>{audioReady=true;}).catch(()=>{});}
  if(AC&&AC.state==='running')audioReady=true;
}
function p(f,d,t='sine',v=0.15,ff=null,fe=null){
  if(!AC||!SV.st.sfx)return;
  try{const o=AC.createOscillator(),g=AC.createGain(),tm=AC.currentTime;o.type=t;o.frequency.setValueAtTime(f,tm);if(ff)o.frequency.linearRampToValueAtTime(ff,tm+d*.3);if(fe)o.frequency.linearRampToValueAtTime(fe,tm+d);g.gain.setValueAtTime(Math.min(v,.28),tm);g.gain.exponentialRampToValueAtTime(.001,tm+d);o.connect(g);g.connect(AC.destination);o.start(tm);o.stop(tm+d);}catch(e){}
}

// ─── BGM ────────────────────────────────────
let bgmN=[],bgmG=null,bgmOn=false;
function startBGM(){
  if(!AC||bgmOn)return;if(!SV.st.bgm)return;
  if(AC.state!=='running'){AC.resume().then(()=>{bgmOn=false;startBGM();});return;}
  bgmOn=true;
  try{
    bgmG=AC.createGain();bgmG.gain.setValueAtTime(.09,AC.currentTime);bgmG.connect(AC.destination);
    const notes=[262,294,330,392,440,524,588,660,784,880];let ni=0;
    function sn(){
      if(!bgmOn)return;const f=notes[ni%notes.length],tm=AC.currentTime;
      const o=AC.createOscillator(),g=AC.createGain();o.type='sine';o.frequency.setValueAtTime(f,tm);
      g.gain.setValueAtTime(0,tm);g.gain.linearRampToValueAtTime(.06,tm+.9);g.gain.linearRampToValueAtTime(.018,tm+3.5);g.gain.linearRampToValueAtTime(0,tm+4.2);
      o.connect(g);g.connect(bgmG);o.start();o.stop(tm+4.7);bgmN.push(o,g);
      ni=(ni+1+Math.floor(Math.random()*3))%notes.length;setTimeout(sn,3600+Math.random()*2000);
    }sn();
  }catch(e){console.log('BGM fail:',e);}
}
function stopBGM(){bgmOn=false;for(const n of bgmN){try{n.stop()}catch(e){}}bgmN=[];if(bgmG)bgmG.disconnect();bgmG=null;}

// Auto-start audio on any touch
function wakeAudio(){
  if(!audioReady){ia();if(!bgmOn&&SV.st.bgm)startBGM();}
}
document.addEventListener('touchstart',wakeAudio,{passive:true});
document.addEventListener('click',wakeAudio,{passive:true});

// ═══ EVENT DELEGATION ═══════════════════════
function handleAction(a){
  ia();wakeAudio();SFX.click();
  try{
    if(a==='stage')startGame('stage');
    else if(a==='score')startGame('score');
    else if(a==='shop'){showScr('shop');rShop();}
    else if(a==='collection'){showScr('collection');rCol();}
    else if(a==='achievements'){showScr('achievements');rAch();}
    else if(a==='leaderboard'){showScr('leaderboard');rLb();}
    else if(a==='settings'){showScr('settings');rSet();}
    else if(a==='back'){stopBGM();showScr('title');setTimeout(()=>{wakeAudio();if(SV.st.bgm)startBGM();},500);}
    else if(a==='retry'){gsHide();startGame(gm);}
    else if(a==='nextstage')advSt();
    else if(a==='home'){gsHide();stopBGM();showScr('title');setTimeout(()=>{wakeAudio();if(SV.st.bgm)startBGM();},500);}
    else if(a==='pause')pauseGame();
    else if(a==='resume'){$('pause-ol').classList.add('hidden');gs='playing';}
    else if(a==='restart'){$('pause-ol').classList.add('hidden');gsHide();startGame(gm);}
  }catch(e){console.log('Action error:',a,e);}
}
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-action]');if(b){e.preventDefault();handleAction(b.dataset.action);return;}
  const t=e.target.closest('.stab');if(t){document.querySelectorAll('.stab').forEach(x=>x.classList.remove('on'));t.classList.add('on');rShop();}
  const l=e.target.closest('.lbtab');if(l){document.querySelectorAll('.lbtab').forEach(x=>x.classList.remove('on'));l.classList.add('on');rLb();}
  const tg=e.target.closest('.tg');if(tg&&tg.dataset.key){const k=tg.dataset.key;SV.st[k]=!SV.st[k];tg.classList.toggle('on',SV.st[k]);ps();if(k==='bgm'){if(SV.st.bgm)startBGM();else stopBGM();}}
  if(e.target.closest('#btn-clear')){if(confirm('确定清除全部数据？')){stopBGM();SV=defS();ps();showScr('title');setTimeout(()=>{wakeAudio();if(SV.st.bgm)startBGM();},500);nf('已清除','r');}}
});
// Also handle via touchend for mobile reliability
document.addEventListener('touchend',e=>{
  const b=e.target.closest('[data-action]');if(b){e.preventDefault();handleAction(b.dataset.action);}
});

// ═══ GAME LOGIC ═════════════════════════════
function plShoot(){const p=pl;p.sTimer--;if(p.sTimer>0)return;const iv=p.pu==='rapid'?3:p.sInt;p.sTimer=iv;const bx=p.x,by=p.y-p.h*.45,dmg=p.dmg,bs=p.bspd,art=p.art;if(art.pj==='spread'||p.pu==='spread'){bul.push(mkB(bx,by,0,-bs,dmg));bul.push(mkB(bx,by,-1.6,-bs*.88,dmg));bul.push(mkB(bx,by,1.6,-bs*.88,dmg));}else if(art.pj==='big'||p.pu==='big'){bul.push(mkB(bx,by,0,-bs*.78,dmg*3,'#c41e3a','big'));bul.push(mkB(bx-3,by+2,0,-bs*.82,dmg,'#c41e3a'));bul.push(mkB(bx+3,by+2,0,-bs*.82,dmg,'#c41e3a'));}else if(art.pj==='ultra'){bul.push(mkB(bx,by,0,-bs,dmg*2,'#8a3a8a','big'));bul.push(mkB(bx,by,-2,-bs*.82,dmg,'#8a3a8a'));bul.push(mkB(bx,by,2,-bs*.82,dmg,'#8a3a8a'));bul.push(mkB(bx,by,-1,-bs*.9,dmg,'#6a2a6a'));bul.push(mkB(bx,by,1,-bs*.9,dmg,'#6a2a6a'));}else if(art.pj==='homing'){bul.push(mkB(bx,by,0,-bs,dmg,'#5a8a5a'));bul.push(mkB(bx,by,-.5,-bs*.93,dmg,'#5a8a5a'));bul.push(mkB(bx,by,.5,-bs*.93,dmg,'#5a8a5a'));}else if(art.pj==='array'){const n=3;for(let i=0;i<n;i++){const a=-.3+i*.3/(n-1);bul.push(mkB(bx,by,a*3.5,-bs,dmg,'#4a6a8a'));}}else bul.push(mkB(bx,by,0,-bs,dmg));SFX.shoot();}
function enShoot(e){if(e.sTimer>0){e.sTimer--;return;}e.sTimer=e.boss?28:65+Math.random()*55;const ex=e.x,ey=e.y+e.h*.3,ang=Math.atan2(pl.y-ey,pl.x-ex);const s=2+(gm==='stage'?gStage*.26:wave*.05);if(e.boss){for(let i=-3;i<=3;i++){const a=ang+i*.15;eBul.push(mkB(ex,ey,Math.cos(a)*s,Math.sin(a)*s,1,'#8b0000'));}}else{eBul.push(mkB(ex,ey,Math.cos(ang)*s,Math.sin(ang)*s,1,'#8b0000'));if(Math.random()<.2)eBul.push(mkB(ex,ey,Math.cos(ang+.22)*s,Math.sin(ang+.22)*s,1,'#8b0000'));}}
function dmgPl(dmg){if(pl.inv>0)return;if(pl.pu==='shield'){pl.pu=null;pl.puTimer=0;pl.inv=40;SFX.hit();spP(pl.x,pl.y,12,'rgba(180,160,140,1)',.5);return;}pl.hp-=dmg;pl.inv=48;sesDmg=true;SFX.pHit();spP(pl.x,pl.y,6,'#c41e3a',.4);shake(3);combo=0;upCombo();if(pl.hp<=0)go();}
function colD(d){if(d.tp==='stone'){const b=1+gu('stoneBonus')*.2;const v=Math.floor(d.value*b);sesStones+=v;score+=v;spFT(d.x,d.y,'+'+v,'#daa520');SFX.coin();}else if(d.tp==='gourd'){pl.hp=Math.min(pl.mhp,pl.hp+1);spFT(d.x,d.y,'+命','#5a8a5a');SFX.pu();}else if(d.tp==='qi'){pl.qi=Math.min(pl.qiMax,pl.qi+d.val);spFT(d.x,d.y,'+气','#5a8aca');SFX.pu();}else if(d.tp==='pill'){pl.pu=d.sub;pl.puTimer=600;const ns={spread:'散射',rapid:'速射',big:'重击',shield:'护体',orbit:'剑阵'};spFT(d.x,d.y,ns[d.sub]||'?','#8a6aaa');SFX.pu();}}
function killEn(e){e.alive=false;waveRem--;sesKills++;combo++;mCombo=Math.max(mCombo,combo);kdc++;score+=e.sc*(1+Math.floor(combo/15));SFX.combo();upCombo();if(pl.qi<pl.qiMax)pl.qi=Math.min(pl.qiMax,pl.qi+5);const pw=e.boss?2.5:1;spP(e.x,e.y,e.boss?30:12,e.cl,pw);if(e.boss){SFX.bossExp();shake(10);}else{SFX.exp();if(combo>=30)shake(2);}spFT(e.x,e.y,'+'+e.sc,'#1a1a1a');const fd=kdc>=5;if(Math.random()<e.dr||fd)spD(e.x,e.y,fd);if(e.boss){for(let i=0;i<5;i++)spD(e.x+Math.random()*32-16,e.y+Math.random()*24-12,true);}if(pl.qi>=pl.qiMax){pl.qi=0;for(const ene of en){if(!ene.alive||ene.boss)continue;ene.alive=false;waveRem--;score+=ene.sc;combo++;spP(ene.x,ene.y,8,ene.cl,.6);}spP(pl.x,pl.y,45,'rgba(255,220,100,1)',1.8);SFX.stageClear();nf('⚡ 灵气爆发！','g');toast('💥');shake(8);}}
function upCombo(){const el=$('combo');if(combo<5){el.classList.remove('on','s','ss');el.textContent='';return;}el.classList.add('on');const t=COMBO.findLast(t=>combo>=t.m)||COMBO[0];el.textContent=t.n+' x'+combo;el.className=(combo>=75?'on ss':combo>=35?'on s':'on');}

// ═══ WAVES ══════════════════════════════════
function spWave(){waveTm=0;const bw=gm==='stage'?(wave===STAGES[gStage-1].w):(wave%5===0);if(bw){const b=spEn('tm');b.hp=gm==='stage'?STAGES[gStage-1].bh+(gStage-1)*20:20+wave*5;b.mhp=b.hp;en.push(b);waveRem=1;nf('⚠ 强敌来袭！','r');SFX.bossWave();}else{const cnt=3+wave*2;waveRem=cnt;for(let i=0;i<cnt;i++){const r=Math.random();en.push(spEn(r<.5?'ys':r<.78?'mt':'xx'));}SFX.wave();}}

}
function gsHide(){document.querySelectorAll('#goscr,#scscr').forEach(s=>{s.classList.remove('on');s.classList.add('off');});}
function go(){gs='over';pl.pu=null;pl.puTimer=0;SV.tg++;SV.tk+=sesKills;SV.tse+=sesStones;SV.ss+=sesStones;SV.bs=Math.max(SV.bs,score);SV.bc=Math.max(SV.bc,mCombo);if(!sesDmg)SV.ndc++;const dt=new Date().toLocaleDateString('zh-CN');if(gm==='score'){SV.lbScore.push({score,kills:sesKills,wave,combo:mCombo,dt});SV.lbScore.sort((a,b)=>b.score-a.score);SV.lbScore=SV.lbScore.slice(0,10);}else{SV.lbStage.push({stage:gStage,score,kills:sesKills,dt});SV.lbStage.sort((a,b)=>b.stage-b.stage||b.score-a.score);SV.lbStage=SV.lbStage.slice(0,10);}ckAch();ps();$('go-title').textContent='修士陨落';$('go-title').classList.remove('w');$('go-score').textContent=score;$('go-kills').textContent=sesKills;$('go-combo').textContent=mCombo;$('go-wave').textContent=wave;$('go-stones').textContent='💎 +'+sesStones+' 灵石';$('hud').classList.add('off');$('pause-btn').classList.add('off');$('pw-timer').classList.add('off');$('#goscr').classList.remove('off');$('#goscr').classList.add('on');}
function stageClear(){gs='stageclear';pl.pu=null;pl.puTimer=0;SV.tg++;SV.tk+=sesKills;SV.tse+=sesStones;SV.ss+=sesStones;SV.bs=Math.max(SV.bs,score);SV.bc=Math.max(SV.bc,mCombo);if(!sesDmg)SV.ndc++;SV.ms=Math.max(SV.ms,gStage);const dt=new Date().toLocaleDateString('zh-CN');SV.lbStage.push({stage:gStage,score,kills:sesKills,dt});SV.lbStage.sort((a,b)=>b.stage-b.stage||b.score-a.score);SV.lbStage=SV.lbStage.slice(0,10);ckAch();ps();SFX.stageClear();const si=STAGES[gStage-1];$('sc-name').textContent='踏入 '+si.n;$('sc-score').textContent='通关！';$('sc-kills').textContent=sesKills;$('sc-combo').textContent=mCombo;$('sc-hp').textContent=pl.hp+'/'+pl.mhp;$('sc-stones').textContent='💎 +'+sesStones+' 灵石';const ns=STAGES[gStage],nb=$('btn-ns');if(ns&&SV.ss>=ns.us){nb.style.display='';nb.textContent=`下一关·${ns.n}`;}else if(ns){nb.style.display='';nb.textContent=`${ns.n} (需${ns.us}💎解锁)`;}else{nb.style.display='none';}$('hud').classList.add('off');$('pause-btn').classList.add('off');$('pw-timer').classList.add('off');$('#scscr').classList.remove('off');$('#scscr').classList.add('on');toast('🌟');}
function advSt(){const ns=STAGES[gStage];if(ns&&SV.ss>=ns.us){$('#scscr').classList.add('off');gStage++;wave=1;score+=500;sesStones=0;sesKills=0;mCombo=0;combo=0;sesDmg=false;kdc=0;fc=0;pl=mkPl();bul=[];eBul=[];en=[];pts=[];drs=[];fts=[];initBg();gsHide();showScr('game');$('pw-timer').classList.add('off');$('h-mode').textContent='闯关·'+STAGES[gStage-1].n;$('h-wave').textContent='第1波';upHUD();spWave();gs='playing';}else nf('灵石不足或已通关','r');}
function pauseGame(){if(gs!=='playing')return;gs='paused';$('pause-ol').classList.remove('hidden');}

// ═══ HUD ═══════════════════════════════════
function upHUD(){$('h-score').textContent=score;$('h-wave').textContent=gm==='stage'?'第'+wave+'/'+STAGES[gStage-1].w+'波':'第'+wave+'波';$('h-stones').textContent='+'+sesStones;$('h-kills').textContent=sesKills;$('hp-fill').style.width=(pl.hp/pl.mhp*100)+'%';$('qi-fill').style.width=(pl.qi/pl.qiMax*100)+'%';if(pl.puTimer>0&&pl.pu){const sec=Math.ceil(pl.puTimer/60);$('pw-timer').classList.remove('off');$('pw-timer').textContent=pl.pu+' '+sec+'s';}else{$('pw-timer').classList.add('off');}}

// ═══ UPDATE ════════════════════════════════
function update(){if(gs!=='playing')return;fc++;const p=pl;if(ptr.active){const dx=ptr.x-p.x,dy=ptr.y-p.y,dist=Math.sqrt(dx*dx+dy*dy);if(dist>1){const ms=Math.min(p.spd,dist);p.x+=dx/dist*ms;p.y+=dy/dist*ms*.75;}}p.x=Math.max(p.w/2,Math.min(W-p.w/2,p.x));p.y=Math.max(p.h/2,Math.min(H-p.h/2,p.y));if(p.inv>0)p.inv--;if(p.puTimer>0){p.puTimer--;if(p.puTimer<=0)p.pu=null;}plShoot();for(const b of bul){b.x+=b.vx;b.y+=b.vy;if(b.y<-20||b.y>H+20||b.x<-20||b.x>W+20)b.alive=false;}for(const b of eBul){b.x+=b.vx;b.y+=b.vy;if(b.y<-20||b.y>H+20||b.x<-20||b.x>W+20)b.alive=false;}for(const e of en){if(!e.alive)continue;e.y+=e.spd;e.wb+=e.wbSp;e.x+=Math.sin(e.wb)*e.wbAmp;e.x=Math.max(e.w/2,Math.min(W-e.w/2,e.x));if(e.fl>0)e.fl--;if(e.sht)enShoot(e);if(e.y>H+e.h){e.alive=false;waveRem--;if(!e.boss)dmgPl(1);}}for(const b of bul){if(!b.alive)continue;for(const e of en){if(!e.alive)continue;const dx=b.x-e.x,dy=b.y-e.y;if(Math.abs(dx)<e.w*.4&&Math.abs(dy)<e.h*.4){b.alive=false;e.hp-=b.dmg;e.fl=4;spP(b.x,b.y,2,'rgba(60,60,60,1)',.2);if(e.hp<=0)killEn(e);else SFX.hit();}}}for(const b of eBul){if(!b.alive)continue;const dx=b.x-p.x,dy=b.y-p.y;if(Math.abs(dx)<p.w*.28&&Math.abs(dy)<p.h*.34){b.alive=false;dmgPl(1);}}for(const e of en){if(!e.alive)continue;const dx=e.x-p.x,dy=e.y-p.y;if(Math.abs(dx)<(e.w+p.w)*.28&&Math.abs(dy)<(e.h+p.h)*.3){e.alive=false;waveRem--;dmgPl(2);spP(e.x,e.y,9,e.cl,.6);score+=e.sc;sesKills++;spFT(e.x,e.y,'碰撞!','#c41e3a');}}for(const d of drs){if(!d.alive)continue;d.y+=d.vy;if(d.y>H+30)d.alive=false;const dx=d.x-p.x,dy=d.y-p.y;if(Math.abs(dx)<d.w+p.w*.3&&Math.abs(dy)<d.h+p.h*.36){d.alive=false;colD(d);}}for(const x of pts){x.x+=x.vx;x.y+=x.vy;x.vx*=.96;x.vy*=.96;x.life--;if(x.life<=0)x.alive=false;}for(const ft of fts){ft.y+=ft.vy;ft.life--;if(ft.life<=0)ft.alive=false;}if(shkD>0){shkX=(Math.random()-.5)*shkD;shkY=(Math.random()-.5)*shkD;shkD*=.84;if(shkD<.25)shkD=0;}else{shkX=0;shkY=0;}bul=bul.filter(b=>b.alive);eBul=eBul.filter(b=>b.alive);en=en.filter(e=>e.alive);pts=pts.filter(p=>p.alive);drs=drs.filter(d=>d.alive);fts=fts.filter(f=>f.alive);if(en.filter(e=>e.alive).length===0&&waveRem<=0){waveTm++;if(waveTm>60){if(gm==='stage'&&wave>=STAGES[gStage-1].w){stageClear();return;}wave++;$('h-mode').textContent=gm==='score'?'得分模式':'闯关·'+STAGES[gStage-1].n;spWave();}}upBg();upHUD();}

// ═══ INPUT ═══════════════════════════════════
let ptr={active:false,x:W/2,y:H*.75};
function gPos(e){const r=C.getBoundingClientRect();const t=e.touches?e.touches[0]:e;return{x:t.clientX-r.left,y:t.clientY-r.top};}
C.addEventListener('touchstart',e=>{e.preventDefault();const p=gPos(e);ptr.active=true;ptr.x=p.x;ptr.y=p.y;},{passive:false});
C.addEventListener('touchmove',e=>{e.preventDefault();const p=gPos(e);ptr.x=p.x;ptr.y=p.y;},{passive:false});
C.addEventListener('touchend',e=>{e.preventDefault();ptr.active=false;},{passive:false});
C.addEventListener('mousedown',e=>{const p=gPos(e);ptr.active=true;ptr.x=p.x;ptr.y=p.y;});
C.addEventListener('mousemove',e=>{if(!ptr.active)return;const p=gPos(e);ptr.x=p.x;ptr.y=p.y;});
C.addEventListener('mouseup',()=>{ptr.active=false;});C.addEventListener('mouseleave',()=>{ptr.active=false;});

// ═══ RENDER ═════════════════════════════════
function draw(){cx.clearRect(0,0,W,H);cx.save();cx.translate(shkX,shkY);drBg();for(const d of drs){if(d.alive)drDp(d);}for(const e of en){if(e.alive)drEn(e);}for(const b of eBul){if(b.alive)drBu(b);}for(const b of bul){if(b.alive)drBu(b);}if(gs==='playing')drPl();drPts();drFTs();cx.restore();}
function loop(){rs();update();draw();requestAnimationFrame(loop);}

// ═══ INIT ═══════════════════════════════════
rfUI();pl=mkPl();initBg();loop();refreshTitle();
// Try auto-start audio
ia();setTimeout(()=>{ia();if(SV.st.bgm)startBGM();},300);
console.log('🌌 苍穹仙途 v6');
console.log('🔊 BGM auto-start | 🩸 HP at top | 🎨 Title redesign');
console.log('🔧 Button fix | 📱 Touch event delegation');
</script>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover,maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>苍穹仙途 · 水墨修真弹幕</title>
<style>
:root{--paper:#f5f0e4;--ink:#1a1a1a;--ink2:#555;--gold:#b8860b;--red:#c41e3a;--jade:#5a8a6a;--purple:#6a3a8a}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:var(--paper);touch-action:none;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;
  font-family:'STKaiti','KaiTi','STSong','Songti SC','Noto Serif SC',serif;}

#app{width:100%;height:100%;max-width:500px;max-height:920px;margin:0 auto;
  background:radial-gradient(ellipse at 50% 20%,#faf6ed,#ede3d0 45%,#d8ccb4 100%);
  box-shadow:0 0 80px rgba(0,0,0,.12);position:relative;overflow:hidden;display:flex;flex-direction:column;}

canvas{position:absolute;top:0;left:0;width:100%;height:100%;z-index:0;display:block;}

/* ─── SCREENS ─── */
.scr{position:absolute;top:0;left:0;right:0;bottom:0;z-index:5;display:flex;flex-direction:column;
  overflow-y:auto;pointer-events:none;opacity:0;transition:opacity .2s;}
.scr.show{z-index:10;pointer-events:all;opacity:1;}
.scr.none{display:none;}
.scr.panel-bg{background:rgba(245,240,228,.96);}

/* ─── TITLE ─── */
.title-4{font-size:46px;font-weight:bold;color:var(--ink);letter-spacing:8px;margin-bottom:4px;}
.title-4 span{display:inline-block;animation:tf 2.5s ease-in-out infinite;}
.title-4 span:nth-child(1){animation-delay:0s}.title-4 span:nth-child(2){animation-delay:.12s}
.title-4 span:nth-child(3){animation-delay:.24s}.title-4 span:nth-child(4){animation-delay:.36s}
@keyframes tf{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
.sub{font-size:15px;color:var(--ink2);letter-spacing:6px;margin-bottom:4px;}
.divider{width:60px;height:1px;background:var(--ink);margin:14px auto 22px;opacity:.3;}

.btns{display:flex;flex-direction:column;gap:9px;width:200px;}
.btn{font-family:inherit;font-size:16px;font-weight:bold;padding:11px;border:1.5px solid var(--ink);
  background:transparent;color:var(--ink);letter-spacing:3px;cursor:pointer;border-radius:4px;transition:all .15s;}
.btn:active{background:var(--ink);color:var(--paper);}
.btn.ink{background:var(--ink);color:var(--paper);}
.btn.ink:active{background:var(--red);border-color:var(--red);}
.btn.gold{border-color:var(--gold);color:var(--gold);}
.btn.gold:active{background:var(--gold);color:var(--paper);}
.btn.sm{font-size:12px;padding:7px;}

.stones{display:flex;align-items:center;gap:6px;margin-top:18px;font-size:14px;color:var(--gold);letter-spacing:1px;}

/* ─── HUD ─── */
#hud{position:absolute;top:0;left:0;right:0;z-index:6;pointer-events:none;padding:10px 14px;}
#hud.off{display:none;}
.r{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:1px;}
.it{display:flex;flex-direction:column;}
.lb{font-size:10px;color:var(--ink2);letter-spacing:2px;}
.vl{font-size:21px;font-weight:bold;color:var(--ink);line-height:1.1;}
.vl.g{color:var(--gold);}

/* HUD pause button */
#pause-btn{position:absolute;top:10px;right:14px;z-index:7;pointer-events:all;
  font-family:inherit;font-size:20px;background:rgba(0,0,0,.08);border:none;width:36px;height:36px;
  border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--ink);}
#pause-btn.off{display:none;}

/* Power-up timer */
#pw-timer{position:absolute;top:44px;right:14px;z-index:7;pointer-events:none;
  font-size:13px;font-weight:bold;color:var(--red);letter-spacing:1px;}
#pw-timer.off{display:none;}

/* Combo */
#combo{text-align:center;margin-top:2px;font-size:17px;font-weight:bold;opacity:0;transition:opacity .2s;}
#combo.on{opacity:1;}
#combo.s{color:var(--gold);}#combo.ss{color:var(--red);animation:pulse .5s infinite;}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}

/* HP/Qi bars */
#hp-bar-wrap{position:absolute;bottom:14px;left:14px;right:14px;z-index:6;pointer-events:none;height:4px;background:rgba(0,0,0,.06);border-radius:2px;}
#hp-bar-wrap.off{display:none;}
#hp-bar-fill{height:100%;background:var(--red);border-radius:2px;transition:width .3s;}
#qi-bar-wrap{position:absolute;bottom:22px;left:14px;right:14px;z-index:6;pointer-events:none;height:3px;background:rgba(0,0,0,.04);border-radius:2px;}
#qi-bar-wrap.off{display:none;}
#qi-bar-fill{height:100%;background:var(--gold);border-radius:2px;transition:width .3s;}

/* Notifications */
#nf-ctr{position:absolute;top:54px;left:50%;transform:translateX(-50%);z-index:20;pointer-events:none;display:flex;flex-direction:column;align-items:center;gap:7px;}
.nf{background:rgba(26,26,26,.92);color:var(--paper);padding:9px 18px;border-radius:6px;font-size:13px;letter-spacing:2px;animation:nfi .4s, nfo .4s 2s ease-in forwards;max-width:260px;text-align:center;}
.nf.g{border:1px solid var(--gold);}.nf.r{border:1px solid var(--red);}
@keyframes nfi{0%{opacity:0;transform:translateY(-18px)}100%{opacity:1;transform:translateY(0)}}
@keyframes nfo{0%{opacity:1}100%{opacity:0;transform:translateY(-10px)}}

/* Panel components */
.ph{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid rgba(0,0,0,.07);flex-shrink:0;}
.pt{font-size:20px;font-weight:bold;color:var(--ink);letter-spacing:4px;}
.pb{font-family:inherit;font-size:14px;background:none;border:none;color:var(--ink2);cursor:pointer;letter-spacing:2px;}
.pb:active{color:var(--ink);}
.pbd{padding:14px 18px;flex:1;overflow-y:auto;}

/* Shop */
.stabs{display:flex;border-bottom:1px solid rgba(0,0,0,.07);flex-shrink:0;}
.stab{flex:1;font-family:inherit;font-size:13px;padding:9px;background:none;border:none;color:var(--ink2);cursor:pointer;letter-spacing:2px;}
.stab.on{color:var(--ink);font-weight:bold;border-bottom:2px solid var(--ink);}
.si{display:flex;align-items:center;justify-content:space-between;padding:13px 0;border-bottom:1px solid rgba(0,0,0,.04);flex-shrink:0;}
.sn{font-size:14px;font-weight:bold;color:var(--ink);}
.sd{font-size:10px;color:var(--ink2);margin-top:1px;}
.sc{font-size:13px;color:var(--gold);font-weight:bold;margin-right:10px;white-space:nowrap;}
.sb{font-family:inherit;font-size:11px;padding:5px 12px;border:1px solid var(--gold);background:transparent;color:var(--gold);cursor:pointer;border-radius:3px;letter-spacing:1px;white-space:nowrap;}
.sb:active{background:var(--gold);color:#fff;}
.sb.ok{color:var(--jade);border-color:var(--jade);}
.slv{font-size:10px;color:var(--ink2);margin-left:3px;}

/* Collection */
.cg{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
.cc{border:1px solid rgba(0,0,0,.07);border-radius:8px;padding:12px 6px;text-align:center;transition:all .2s;}
.cc.lk{opacity:.4;filter:grayscale(1);}
.cc.own{border-color:var(--gold);background:rgba(184,134,11,.04);cursor:pointer;}
.cc.eq{border-color:var(--red);background:rgba(196,30,58,.05);}
.ci{font-size:34px;margin-bottom:5px;}
.cn{font-size:11px;font-weight:bold;color:var(--ink);}
.cd{font-size:9px;color:var(--ink2);margin-top:1px;}

/* Achievements */
.ai{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid rgba(0,0,0,.04);flex-shrink:0;}
.ai.lk{opacity:.4;filter:grayscale(1);}
.aico{font-size:26px;min-width:32px;text-align:center;}
.aname{font-size:13px;font-weight:bold;color:var(--ink);}
.adesc{font-size:10px;color:var(--ink2);}
.arew{font-size:11px;color:var(--gold);}

/* Leaderboard */
.lbtabs{display:flex;border-bottom:1px solid rgba(0,0,0,.07);flex-shrink:0;}
.lbtab{flex:1;font-family:inherit;font-size:12px;padding:8px;background:none;border:none;color:var(--ink2);cursor:pointer;letter-spacing:1px;}
.lbtab.on{color:var(--ink);font-weight:bold;border-bottom:2px solid var(--ink);}
.lbi{display:flex;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid rgba(0,0,0,.03);}
.lbr{font-size:15px;font-weight:bold;width:26px;text-align:center;}
.lbr.top{color:var(--gold);}
.lbs{font-size:17px;font-weight:bold;color:var(--ink);flex:1;text-align:right;}
.lbd{font-size:9px;color:var(--ink2);}

/* Settings */
.sr{display:flex;align-items:center;justify-content:space-between;padding:13px 0;border-bottom:1px solid rgba(0,0,0,.04);}
.sl{font-size:14px;color:var(--ink);}
.sld{font-size:10px;color:var(--ink2);}
.tg{width:48px;height:26px;background:#ccc;border-radius:13px;position:relative;cursor:pointer;transition:background .2s;flex-shrink:0;}
.tg.on{background:var(--jade);}
.tg::after{content:'';position:absolute;top:2px;left:2px;width:22px;height:22px;background:#fff;border-radius:50%;transition:left .2s;box-shadow:0 1px 3px rgba(0,0,0,.2);}
.tg.on::after{left:24px;}
.dbtn{font-family:inherit;font-size:12px;padding:7px 14px;border:1px solid var(--red);background:transparent;color:var(--red);cursor:pointer;border-radius:4px;letter-spacing:1px;}
.dbtn:active{background:var(--red);color:#fff;}

/* Results */
.rbox{text-align:center;padding:16px;width:100%;}
.rtitle{font-size:30px;font-weight:bold;letter-spacing:6px;color:var(--ink);}
.rtitle.win{color:var(--gold);}
.rscore{font-size:52px;font-weight:bold;color:var(--ink);margin:6px 0;}
.rstats{display:flex;justify-content:center;gap:20px;margin:14px 0;flex-wrap:wrap;}
.rst{text-align:center;}
.rstv{font-size:18px;font-weight:bold;color:var(--gold);}
.rstl{font-size:10px;color:var(--ink2);}
.rstones{font-size:17px;color:var(--gold);margin:6px 0;font-weight:bold;}
.rbtns{display:flex;flex-direction:column;gap:9px;align-items:center;margin-top:14px;}

/* Pause overlay */
#pause-overlay{position:absolute;top:0;left:0;right:0;bottom:0;z-index:8;
  background:rgba(245,240,228,.85);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;}
#pause-overlay.hidden{display:none;}
#pause-overlay .pause-title{font-size:28px;font-weight:bold;color:var(--ink);letter-spacing:6px;margin-bottom:10px;}

/* Toast */
.toast{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:30;font-size:56px;pointer-events:none;animation:tp .8s ease-out forwards;}
@keyframes tp{0%{opacity:0;transform:translate(-50%,-50%) scale(.3)}30%{opacity:1;transform:translate(-50%,-50%) scale(1.2)}100%{opacity:0;transform:translate(-50%,-50%) scale(1.5)}}

@media(max-width:380px){.title-4{font-size:36px}.btn{font-size:14px;padding:10px}.rscore{font-size:40px}}
</style>
</head>
<body>
<div id="app">
<canvas id="c"></canvas>

<!-- HUD -->
<div id="hud" class="off">
  <div class="r"><div class="it"><span class="lb">得分</span><span class="vl" id="h-score">0</span></div><div class="it" style="align-items:flex-end"><span class="lb" id="h-mode">闯关</span><span class="vl g" id="h-wave">第1波</span></div></div>
  <div class="r"><div class="it"><span class="lb">灵石</span><span class="vl g" id="h-stones">+0</span></div><div class="it" style="align-items:flex-end"><span class="lb">击杀</span><span class="vl" id="h-kills">0</span></div></div>
  <div id="combo"></div>
</div>
<button id="pause-btn" class="off" data-action="pause">⏸</button>
<div id="pw-timer" class="off"></div>

<div id="hp-bar-wrap" class="off"><div id="hp-bar-fill" style="width:100%"></div></div>
<div id="qi-bar-wrap" class="off"><div id="qi-bar-fill" style="width:0%"></div></div>
<div id="nf-ctr"></div>

<!-- PAUSE -->
<div id="pause-overlay" class="hidden">
  <div class="pause-title">暂停</div>
  <button class="btn ink" data-action="resume">继续</button>
  <button class="btn" data-action="restart">重来</button>
  <button class="btn" data-action="home">回主页</button>
</div>

<!-- TITLE -->
<div class="scr show panel-bg" id="titlescr" style="justify-content:center;align-items:center;text-align:center;">
  <div style="flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;">
    <div class="title-4"><span>苍</span><span>穹</span><span>仙</span><span>途</span></div>
    <div class="sub">CULTIVATION SKY</div>
    <div class="divider"></div>
    <div class="btns">
      <button class="btn ink" data-action="stage">⚔️ 闯关模式</button>
      <button class="btn" data-action="score">🏆 得分模式</button>
      <button class="btn gold" data-action="shop">🏪 仙坊</button>
      <button class="btn" data-action="collection">📜 法宝图鉴</button>
      <button class="btn" data-action="achievements">🎖 成就</button>
      <button class="btn" data-action="leaderboard">📊 排行榜</button>
      <button class="btn sm" data-action="settings">⚙️ 设置</button>
    </div>
    <div class="stones">💎 <span id="t-stones">0</span> 灵石</div>
  </div>
</div>

<!-- SHOP -->
<div class="scr none panel-bg" id="shopscr">
  <div class="ph"><button class="pb" data-action="back">← 返回</button><span class="pt">仙坊</span><span style="color:var(--gold);font-size:13px">💎 <span id="s-stones">0</span></span></div>
  <div class="stabs"><button class="stab on" data-tab="upgrade">修为提升</button><button class="stab" data-tab="artifact">法宝购买</button></div>
  <div class="pbd" id="shop-list"></div>
</div>

<!-- COLLECTION -->
<div class="scr none panel-bg" id="collectionscr">
  <div class="ph"><button class="pb" data-action="back">← 返回</button><span class="pt">法宝图鉴</span><span style="font-size:11px;color:var(--ink2)" id="cc-count"></span></div>
  <div class="pbd"><div class="cg" id="coll-grid"></div></div>
</div>

<!-- ACHIEVEMENTS -->
<div class="scr none panel-bg" id="achievementsscr">
  <div class="ph"><button class="pb" data-action="back">← 返回</button><span class="pt">成就</span><span style="font-size:11px;color:var(--ink2)" id="ac-count"></span></div>
  <div class="pbd" id="ac-list"></div>
</div>

<!-- LEADERBOARD -->
<div class="scr none panel-bg" id="leaderboardscr">
  <div class="ph"><button class="pb" data-action="back">← 返回</button><span class="pt">排行榜</span></div>
  <div class="lbtabs"><button class="lbtab on" data-mode="score">得分模式</button><button class="lbtab" data-mode="stage">闯关模式</button></div>
  <div class="pbd"><div id="lb-list"></div></div>
</div>

<!-- SETTINGS -->
<div class="scr none panel-bg" id="settingsscr">
  <div class="ph"><button class="pb" data-action="back">← 返回</button><span class="pt">设置</span></div>
  <div class="pbd">
    <div class="sr"><div><div class="sl">🔊 音效</div><div class="sld">射击、爆炸等音效</div></div><div class="tg on" id="tg-sfx" data-key="sfx"></div></div>
    <div class="sr"><div><div class="sl">🎵 背景音乐</div><div class="sld">修仙氛围音乐</div></div><div class="tg on" id="tg-bgm" data-key="bgm"></div></div>
    <div class="sr"><div><div class="sl">💾 保存</div><div class="sld">自动存至浏览器</div></div><span style="font-size:10px;color:var(--jade)">✓ 已启用</span></div>
    <div class="sr"><div><div class="sl">🗑️ 清除数据</div><div class="sld">重置全部进度</div></div><button class="dbtn" id="btn-clear">清除</button></div>
    <div style="text-align:center;margin-top:22px;font-size:10px;color:var(--ink2)">🖌️ 水墨修真 · v4 · 数据本地存储</div>
  </div>
</div>

<!-- GAMEOVER -->
<div class="scr none" id="goscr" style="background:rgba(245,240,228,.92);justify-content:center;align-items:center;">
  <div class="rbox">
    <div class="rtitle" id="go-title">修士陨落</div>
    <div style="font-size:13px;color:var(--ink2);margin-top:4px">最终得分</div>
    <div class="rscore" id="go-score">0</div>
    <div class="rstats">
      <div class="rst"><div class="rstv" id="go-kills">0</div><div class="rstl">击杀</div></div>
      <div class="rst"><div class="rstv" id="go-combo">0</div><div class="rstl">最高连击</div></div>
      <div class="rst"><div class="rstv" id="go-wave">0</div><div class="rstl">波次</div></div>
    </div>
    <div class="rstones" id="go-stones">💎 +0 灵石</div>
    <div class="rbtns">
      <button class="btn ink" data-action="retry">再战</button>
      <button class="btn" data-action="home">返回</button>
    </div>
  </div>
</div>

<!-- STAGE CLEAR -->
<div class="scr none" id="scscr" style="background:rgba(245,240,228,.92);justify-content:center;align-items:center;">
  <div class="rbox">
    <div class="rtitle win">道心突破</div>
    <div style="font-size:15px;color:var(--ink);margin-top:4px" id="sc-name"></div>
    <div class="rscore" style="font-size:36px;color:var(--gold)" id="sc-score">通关！</div>
    <div class="rstats">
      <div class="rst"><div class="rstv" id="sc-kills">0</div><div class="rstl">击杀</div></div>
      <div class="rst"><div class="rstv" id="sc-combo">0</div><div class="rstl">最高连击</div></div>
      <div class="rst"><div class="rstv" id="sc-hp">0</div><div class="rstl">剩余生命</div></div>
    </div>
    <div class="rstones" id="sc-stones">💎 +0 灵石</div>
    <div class="rbtns">
      <button class="btn ink" data-action="nextstage">下一关</button>
      <button class="btn" data-action="home">返回</button>
    </div>
  </div>
</div>
</div>

<script>
// ═══════════════════════════════════════════════
//  苍穹仙途 v4 · Ink Cultivation Sky Shooter
// ═══════════════════════════════════════════════
const $=id=>document.getElementById(id);
const C=$('c'),cx=C.getContext('2d');
let W,H,R; // R = devicePixelRatio
function rs(){
  const r=$('app').getBoundingClientRect();W=r.width;H=r.height;
  R=Math.min(window.devicePixelRatio||1,2);
  C.width=W*R;C.height=H*R;cx.setTransform(R,0,0,R,0,0);
}
window.addEventListener('resize',rs);rs();

// ═══ DATA ════════════════════════════════════
const STAGES=[
  {n:'炼气期',w:5,bh:20,us:0},{n:'筑基期',w:7,bh:35,us:0},{n:'金丹期',w:9,bh:55,us:0},
  {n:'元婴期',w:11,bh:80,us:500},{n:'化神期',w:13,bh:120,us:1500},
  {n:'炼虚期',w:15,bh:170,us:4000},{n:'合体期',w:17,bh:240,us:8000},
  {n:'大乘期',w:20,bh:330,us:15000},{n:'渡劫飞升',w:25,bh:500,us:30000},
];
const COMBO_TITLES=[
  {m:0,n:'初学乍练',c:'#8a8a8a'},{m:5,n:'小有所成',c:'#6a8a6a'},{m:10,n:'炉火纯青',c:'#4a8a4a'},
  {m:20,n:'融会贯通',c:'#2a7a2a'},{m:35,n:'登峰造极',c:'#b8860b'},{m:50,n:'举世无双',c:'#daa520'},
  {m:75,n:'天人合一',c:'#c41e3a'},{m:100,n:'破碎虚空',c:'#8a3a8a'},
];
const ARTIFACTS=[
  {id:'s1',n:'青釭剑',icon:'🗡️',d:'入门飞剑，灵动飘逸',ul:'初始拥有',pj:'normal',bon:null},
  {id:'s2',n:'紫电剑',icon:'⚡',d:'剑出紫电，射速提升',ul:'击杀500敌',pj:'rapid',bon:{t:'fireRate',v:3}},
  {id:'s3',n:'玄铁重剑',icon:'🗿',d:'重剑无锋大巧不工',ul:'击杀1500敌',pj:'big',bon:{t:'damage',v:2}},
  {id:'s4',n:'碧玉飞刀',icon:'🔪',d:'碧绿飞刀散射周天',ul:'仙坊·2000灵石',pj:'spread',bon:{t:'spread',v:1}},

let AC=null,userInteracted=false;
function ia(){
  if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)();}catch(e){}}
  if(AC&&AC.state==='suspended')AC.resume();
}
function p(f,d,t='sine',v=0.08,ff=null,fe=null){
  if(!AC||!SV.st.sfx)return;
  try{
    const o=AC.createOscillator(),g=AC.createGain(),tm=AC.currentTime;
    o.type=t;o.frequency.setValueAtTime(f,tm);
    if(ff)o.frequency.linearRampToValueAtTime(ff,tm+d*.3);
    if(fe)o.frequency.linearRampToValueAtTime(fe,tm+d);
    g.gain.setValueAtTime(Math.min(v,.12),tm);
    g.gain.exponentialRampToValueAtTime(.001,tm+d);
    o.connect(g);g.connect(AC.destination);o.start(tm);o.stop(tm+d);
  }catch(e){}
}

  click:()=>p(800,.04,'sine',.02),

// ─── BGM ────────────────────────────────────
let bgmNodes=[],bgmGain=null,bgmOn=false;
function startBGM(){
  if(!AC||!SV.st.bgm||bgmOn||!userInteracted)return;bgmOn=true;
  try{
    bgmGain=AC.createGain();bgmGain.gain.setValueAtTime(.035,AC.currentTime);bgmGain.connect(AC.destination);
    const notes=[262,294,330,392,440,524,588,660,784,880];let ni=0;
    function sn(){
      if(!bgmOn)return;
      const f=notes[ni%notes.length],tm=AC.currentTime;
      const o=AC.createOscillator(),g=AC.createGain();
      o.type='sine';o.frequency.setValueAtTime(f,tm);
      g.gain.setValueAtTime(0,tm);g.gain.linearRampToValueAtTime(.025,tm+.9);g.gain.linearRampToValueAtTime(.008,tm+3.2);g.gain.linearRampToValueAtTime(0,tm+4);
      o.connect(g);g.connect(bgmGain);o.start();o.stop(tm+4.5);
      bgmNodes.push(o,g);ni=(ni+1+Math.floor(Math.random()*3))%notes.length;
      setTimeout(sn,3500+Math.random()*1800);
    }
    sn();
  }catch(e){}
}
function stopBGM(){bgmOn=false;for(const n of bgmNodes){try{n.stop()}catch(e){}}bgmNodes=[];if(bgmGain)bgmGain.disconnect();bgmGain=null;}

  for(let i=0;i<7;i++){const p=[],n=8+Math.floor(Math.random()*10),by=H*(.42+i*.08),sw=W/(n-1);for(let j=0;j<n;j++)p.push({x:j*sw+(Math.random()-.5)*sw*.7,y:by-Math.random()*H*.3-i*H*.03});bgM.push({pts:p,cl:ts[i],ly:i,ss:.05+i*.1});}
  bgC=[];for(let i=0;i<10;i++)bgC.push({x:Math.random()*W,y:Math.random()*H*.45,w:30+Math.random()*90,h:12+Math.random()*28,o:.02+Math.random()*.06,s:.08+Math.random()*.25});
  bgS=[];if(gm==='stage'&&gStage>=5)for(let i=0;i<15;i++)bgS.push({x:Math.random()*W,y:Math.random()*H*.5,sz:.5+Math.random()*1.5,tw:Math.random()*Math.PI*2});
}
function upBg(){for(const c of bgC){c.x-=c.s;if(c.x+c.w<-20){c.x=W+20;c.y=Math.random()*H*.45;}}for(const s of bgS)s.tw+=.02;}
function drBg(){
  cx.fillStyle='rgba(245,240,228,.12)';cx.fillRect(0,0,W,H);

  for(const s of bgS){cx.fillStyle=`rgba(255,255,200,${.3+Math.sin(s.tw)*.3})`;cx.beginPath();cx.arc(s.x,s.y,s.sz,0,Math.PI*2);cx.fill();}

}

  cx.fillStyle='rgba(140,130,110,.25)';cx.beginPath();cx.moveTo(-p.w*.08,p.h*.35);cx.quadraticCurveTo(0,p.h*.35+fh*1.5+Math.random()*3,p.w*.08,p.h*.35);cx.quadraticCurveTo(0,p.h*.35+fh*.6,-p.w*.08,p.h*.35);cx.fill();

  cx.strokeStyle='#444';cx.lineWidth=2;cx.beginPath();cx.moveTo(-p.w*.55,-p.h*.08);cx.lineTo(p.w*.55,-p.h*.08);cx.stroke();
  cx.strokeStyle='#666';cx.lineWidth=1;cx.beginPath();cx.moveTo(-p.w*.35,-p.h*.12);cx.lineTo(-p.w*.55,-p.h*.08);cx.lineTo(-p.w*.35,-p.h*.04);cx.stroke();

  cx.beginPath();cx.moveTo(0,-p.h*.48);cx.bezierCurveTo(p.w*.35,-p.h*.32,p.w*.4,p.h*.08,p.w*.22,p.h*.32);cx.bezierCurveTo(p.w*.12,p.h*.38,-p.w*.06,p.h*.38,-p.w*.16,p.h*.32);cx.bezierCurveTo(-p.w*.4,p.h*.08,-p.w*.4,-p.h*.32,0,-p.h*.48);cx.fill();
  // Head
  cx.fillStyle='#f5efe0';cx.beginPath();cx.arc(0,-p.h*.28,p.w*.14,0,Math.PI*2);cx.fill();
  // Hair bun
  cx.fillStyle='#1a1a1a';cx.beginPath();cx.arc(0,-p.h*.36,p.w*.07,0,Math.PI*2);cx.fill();
  // Belt
  cx.strokeStyle='rgba(180,150,100,.5)';cx.lineWidth=1.2;cx.beginPath();cx.moveTo(-p.w*.25,p.h*.0);cx.quadraticCurveTo(0,p.h*.04,p.w*.25,p.h*.0);cx.stroke();

  // Orbit swords (power-up)
  if(pl.pu==='orbit'){const n=4;for(let i=0;i<n;i++){const a=fc*.12+i*Math.PI*2/n;const sx=Math.cos(a)*p.w*.7,sy=Math.sin(a)*p.h*.7;cx.strokeStyle='rgba(200,180,140,.6)';cx.lineWidth=1.5;cx.beginPath();cx.moveTo(sx-6,sy-6);cx.lineTo(sx+6,sy+6);cx.stroke();cx.beginPath();cx.moveTo(sx+6,sy-6);cx.lineTo(sx-6,sy+6);cx.stroke();}}

  cx.restore();
  // Shield
  if(pl.pu==='shield'){cx.strokeStyle='rgba(180,160,140,.5)';cx.lineWidth=2.5;cx.beginPath();cx.arc(pl.x,pl.y,pl.w*.72,0,Math.PI*2);cx.stroke();cx.strokeStyle='rgba(180,160,140,.18)';cx.lineWidth=1;cx.beginPath();cx.arc(pl.x,pl.y,pl.w*.62+Math.sin(fc*.1)*3,0,Math.PI*2);cx.stroke();}
}

  }else{

    // Ear
    cx.fillStyle=e.cl;cx.beginPath();cx.moveTo(-e.w*.2,-e.h*.3);cx.lineTo(-e.w*.35,-e.h*.42);cx.lineTo(-e.w*.08,-e.h*.28);cx.fill();cx.beginPath();cx.moveTo(e.w*.2,-e.h*.3);cx.lineTo(e.w*.35,-e.h*.42);cx.lineTo(e.w*.08,-e.h*.28);cx.fill();

// ═══ GAME LOGIC ═════════════════════════════
function plShoot(){
  const p=pl;p.sTimer--;if(p.sTimer>0)return;
  const iv=p.pu==='rapid'?3:p.sInt;p.sTimer=iv;
  const bx=p.x,by=p.y-p.h*.45,dmg=p.dmg,bs=p.bspd,art=p.art;
  if(art.pj==='spread'||p.pu==='spread'){bul.push(mkB(bx,by,0,-bs,dmg));bul.push(mkB(bx,by,-1.5,-bs*.88,dmg));bul.push(mkB(bx,by,1.5,-bs*.88,dmg));}
  else if(art.pj==='big'||p.pu==='big'){bul.push(mkB(bx,by,0,-bs*.78,dmg*3,'#c41e3a','big'));bul.push(mkB(bx-3,by+2,0,-bs*.82,dmg,'#c41e3a'));bul.push(mkB(bx+3,by+2,0,-bs*.82,dmg,'#c41e3a'));}
  else if(art.pj==='ultra'){bul.push(mkB(bx,by,0,-bs,dmg*2,'#8a3a8a','big'));bul.push(mkB(bx,by,-2,-bs*.83,dmg,'#8a3a8a'));bul.push(mkB(bx,by,2,-bs*.83,dmg,'#8a3a8a'));bul.push(mkB(bx,by,-1,-bs*.9,dmg,'#6a2a6a'));bul.push(mkB(bx,by,1,-bs*.9,dmg,'#6a2a6a'));}
  else if(art.pj==='homing'){bul.push(mkB(bx,by,0,-bs,dmg,'#5a8a5a'));bul.push(mkB(bx,by,-.5,-bs*.93,dmg,'#5a8a5a'));bul.push(mkB(bx,by,.5,-bs*.93,dmg,'#5a8a5a'));}
  else if(art.pj==='array'){const n=3;for(let i=0;i<n;i++){const a=-.3+i*.3/(n-1);bul.push(mkB(bx,by,a*3,-bs,dmg,'#4a6a8a'));}}
  else bul.push(mkB(bx,by,0,-bs,dmg));
  SFX.shoot();
}
function enShoot(e){
  if(e.sTimer>0){e.sTimer--;return;}e.sTimer=e.boss?32:70+Math.random()*60;
  const ex=e.x,ey=e.y+e.h*.35,ang=Math.atan2(pl.y-ey,pl.x-ex);
  const s=2.1+(gm==='stage'?gStage*.28:wave*.05);
  if(e.boss){for(let i=-3;i<=3;i++){const a=ang+i*.16;eBul.push(mkB(ex,ey,Math.cos(a)*s,Math.sin(a)*s,1,'#8b0000'));}}
  else{eBul.push(mkB(ex,ey,Math.cos(ang)*s,Math.sin(ang)*s,1,'#8b0000'));if(Math.random()<.25)eBul.push(mkB(ex,ey,Math.cos(ang+.25)*s,Math.sin(ang+.25)*s,1,'#8b0000'));}
}
function dmgPl(dmg){
  if(pl.inv>0)return;
  if(pl.pu==='shield'){pl.pu=null;pl.puTimer=0;pl.inv=42;SFX.hit();spP(pl.x,pl.y,14,'rgba(180,160,140,1)',.6);return;}
  pl.hp-=dmg;pl.inv=50;sesDmg=true;SFX.pHit();spP(pl.x,pl.y,7,'#c41e3a',.5);shake(4);
  combo=0;upCombo();if(pl.hp<=0)go();
}
function colD(d){
  if(d.tp==='stone'){const b=1+gu('stoneBonus')*.2;const v=Math.floor(d.value*b);sesStones+=v;score+=v;spFT(d.x,d.y,'+'+v,'#daa520');SFX.coin();}
  else if(d.tp==='gourd'){pl.hp=Math.min(pl.mhp,pl.hp+1);spFT(d.x,d.y,'+命','#5a8a5a');SFX.pu();}
  else if(d.tp==='qi'){pl.qi=Math.min(pl.qiMax,pl.qi+d.val);spFT(d.x,d.y,'+气','#5a8aca');SFX.pu();}
  else if(d.tp==='pill'){pl.pu=d.sub;pl.puTimer=600;const ns={spread:'散射',rapid:'速射',big:'重击',shield:'护体',orbit:'剑阵'};spFT(d.x,d.y,ns[d.sub]||'?','#8a6aaa');SFX.pu();}
}
function killEn(e){
  e.alive=false;waveRem--;sesKills++;combo++;mCombo=Math.max(mCombo,combo);killDropCounter++;
  score+=e.sc*(1+Math.floor(combo/15));SFX.combo();upCombo();
  if(pl.qi<pl.qiMax)pl.qi=Math.min(pl.qiMax,pl.qi+5);
  const pw=e.boss?2.5:1;spP(e.x,e.y,e.boss?32:13,e.cl,pw);
  if(e.boss){SFX.bossExp();shake(12);}else{SFX.exp();if(combo>=30)shake(3);}
  spFT(e.x,e.y,'+'+e.sc,'#1a1a1a');
  // Guaranteed drops
  const forceDrop=killDropCounter>=5;
  if(Math.random()<e.dr||forceDrop)spD(e.x,e.y,forceDrop);
  if(e.boss){for(let i=0;i<4;i++)spD(e.x+Math.random()*36-18,e.y+Math.random()*28-14,true);}
  // Qi burst
  if(pl.qi>=pl.qiMax){pl.qi=0;for(const ene of en){if(!ene.alive||ene.boss)continue;ene.alive=false;waveRem--;score+=ene.sc;combo++;spP(ene.x,ene.y,9,ene.cl,.7);}spP(pl.x,pl.y,50,'rgba(255,220,100,1)',2);SFX.stageClear();nf('⚡ 灵气爆发！','g');toast('💥');shake(10);}
}
function upCombo(){
  const el=$('combo');if(combo<5){el.classList.remove('on','s','ss');el.textContent='';return;}
  el.classList.add('on');const t=COMBO_TITLES.findLast(t=>combo>=t.m)||COMBO_TITLES[0];el.textContent=t.n+' x'+combo;
  el.className=(combo>=75?'on ss':combo>=35?'on s':'on');
}

// ═══ WAVES ══════════════════════════════════
function spWave(){
  waveTm=0;const bw=gm==='stage'?(wave===STAGES[gStage-1].w):(wave%5===0);
  const cnt=bw?1:(3+wave*2);waveRem=cnt;
  if(bw){const b=spEn('tm');b.hp=gm==='stage'?STAGES[gStage-1].bh+(gStage-1)*18:18+wave*5;b.mhp=b.hp;en.push(b);nf('⚠ 强敌来袭！','r');SFX.bossWave();for(let i=0;i<2+Math.floor(wave/3);i++){en.push(spEn(Math.random()<.5?'ys':'xx'));waveRem++;}}
  else{for(let i=0;i<cnt;i++){const r=Math.random();en.push(spEn(r<.5?'ys':r<.78?'mt':'xx'));}}
  SFX.wave();
}

function gsHide(){

}
function go(){
  gs='over';pl.pu=null;pl.puTimer=0;
  SV.tg++;SV.tk+=sesKills;SV.tse+=sesStones;SV.ss+=sesStones;
  SV.bs=Math.max(SV.bs,score);SV.bc=Math.max(SV.bc,mCombo);
  if(!sesDmg)SV.ndc++;
  const dt=new Date().toLocaleDateString('zh-CN');
  if(gm==='score'){SV.lbScore.push({score,kills:sesKills,wave,combo:mCombo,dt});SV.lbScore.sort((a,b)=>b.score-a.score);SV.lbScore=SV.lbScore.slice(0,10);}
  else{SV.lbStage.push({stage:gStage,score,kills:sesKills,dt});SV.lbStage.sort((a,b)=>b.stage-b.stage||b.score-a.score);SV.lbStage=SV.lbStage.slice(0,10);}
  ckAch();sv();
  $('go-title').textContent='修士陨落';$('go-title').classList.remove('win');
  $('go-score').textContent=score;$('go-kills').textContent=sesKills;
  $('go-combo').textContent=mCombo;$('go-wave').textContent=wave;
  $('go-stones').textContent='💎 +'+sesStones+' 灵石';
  $('hud').classList.add('off');$('pause-btn').classList.add('off');$('pw-timer').classList.add('off');
  $('hp-bar-wrap').classList.add('off');$('qi-bar-wrap').classList.add('off');
  $('#goscr').classList.remove('none');$('#goscr').classList.add('show');
}
function stageClear(){
  gs='stageclear';pl.pu=null;pl.puTimer=0;
  SV.tg++;SV.tk+=sesKills;SV.tse+=sesStones;SV.ss+=sesStones;
  SV.bs=Math.max(SV.bs,score);SV.bc=Math.max(SV.bc,mCombo);
  if(!sesDmg)SV.ndc++;SV.ms=Math.max(SV.ms,gStage);
  const dt=new Date().toLocaleDateString('zh-CN');
  SV.lbStage.push({stage:gStage,score,kills:sesKills,dt});SV.lbStage.sort((a,b)=>b.stage-b.stage||b.score-a.score);SV.lbStage=SV.lbStage.slice(0,10);
  ckAch();sv();SFX.stageClear();
  const si=STAGES[gStage-1];$('sc-name').textContent='踏入 '+si.n;$('sc-score').textContent='通关！';
  $('sc-kills').textContent=sesKills;$('sc-combo').textContent=mCombo;$('sc-hp').textContent=pl.hp+'/'+pl.mhp;
  $('sc-stones').textContent='💎 +'+sesStones+' 灵石';
  const ns=STAGES[gStage];
  if(ns&&SV.ss>=ns.us){const b=document.querySelector('[data-action=nextstage]');b.style.display='';b.textContent=`下一关·${ns.n}`;}
  else if(ns){const b=document.querySelector('[data-action=nextstage]');b.style.display='';b.textContent=`${ns.n} (需${ns.us}💎解锁)`;}
  else{document.querySelector('[data-action=nextstage]').style.display='none';}
  $('hud').classList.add('off');$('pause-btn').classList.add('off');$('pw-timer').classList.add('off');
  $('hp-bar-wrap').classList.add('off');$('qi-bar-wrap').classList.add('off');
  $('#scscr').classList.remove('none');$('#scscr').classList.add('show');
  toast('🌟');
}
function advStage(){const ns=STAGES[gStage];if(ns&&SV.ss>=ns.us){$('#scscr').classList.add('none');gStage++;wave=1;score+=500;sesStones=0;sesKills=0;mCombo=0;combo=0;sesDmg=false;killDropCounter=0;fc=0;pl=mkPl();bul=[];eBul=[];en=[];pts=[];drs=[];fts=[];initBg();gsHide();$('hud').classList.remove('off');$('pause-btn').classList.remove('off');$('hp-bar-wrap').classList.remove('off');$('qi-bar-wrap').classList.remove('off');$('h-mode').textContent='闯关·'+STAGES[gStage-1].n;$('h-wave').textContent='第1波';upHUD();spWave();gs='playing';}else nf('灵石不足或已通关','r');}
function pauseGame(){if(gs!=='playing')return;gs='paused';docPauseO.classList.remove('hidden');}

// ═══ HUD ═══════════════════════════════════
function upHUD(){
  $('h-score').textContent=score;
  $('h-wave').textContent=gm==='stage'?'第'+wave+'/'+STAGES[gStage-1].w+'波':'第'+wave+'波';
  $('h-stones').textContent='+'+sesStones;$('h-kills').textContent=sesKills;
  $('hp-bar-fill').style.width=(pl.hp/pl.mhp*100)+'%';
  $('qi-bar-fill').style.width=(pl.qi/pl.qiMax*100)+'%';
  // Power-up timer
  if(pl.puTimer>0&&pl.pu){
    const sec=Math.ceil(pl.puTimer/60);
    $('pw-timer').classList.remove('off');$('pw-timer').textContent=pl.pu+' '+sec+'s';
  }else{$('pw-timer').classList.add('off');}
}

// ═══ UPDATE ════════════════════════════════
function update(){
  if(gs!=='playing')return;fc++;const p=pl;
  // Pointer
  if(ptr.active){const dx=ptr.x-p.x,dy=ptr.y-p.y,dist=Math.sqrt(dx*dx+dy*dy);if(dist>1){const ms=Math.min(p.spd,dist);p.x+=dx/dist*ms;p.y+=dy/dist*ms*.75;}}
  p.x=Math.max(p.w/2,Math.min(W-p.w/2,p.x));p.y=Math.max(p.h/2,Math.min(H-p.h/2,p.y));
  if(p.inv>0)p.inv--;if(p.puTimer>0){p.puTimer--;if(p.puTimer<=0)p.pu=null;}
  plShoot();
  // Bullets
  for(const b of bul){b.x+=b.vx;b.y+=b.vy;if(b.y<-20||b.y>H+20||b.x<-20||b.x>W+20)b.alive=false;}
  for(const b of eBul){b.x+=b.vx;b.y+=b.vy;if(b.y<-20||b.y>H+20||b.x<-20||b.x>W+20)b.alive=false;}
  // Enemies
  for(const e of en){if(!e.alive)continue;e.y+=e.spd;e.wb+=e.wbSp;e.x+=Math.sin(e.wb)*e.wbAmp;e.x=Math.max(e.w/2,Math.min(W-e.w/2,e.x));if(e.fl>0)e.fl--;if(e.sht)enShoot(e);if(e.y>H+e.h){e.alive=false;waveRem--;if(!e.boss)dmgPl(1);}}
  // Collision: player bullets → enemies
  for(const b of bul){if(!b.alive)continue;for(const e of en){if(!e.alive)continue;const dx=b.x-e.x,dy=b.y-e.y;if(Math.abs(dx)<e.w*.4&&Math.abs(dy)<e.h*.4){b.alive=false;e.hp-=b.dmg;e.fl=4;spP(b.x,b.y,2,'rgba(60,60,60,1)',.2);if(e.hp<=0)killEn(e);else SFX.hit();}}}
  // Enemy bullets → player
  for(const b of eBul){if(!b.alive)continue;const dx=b.x-p.x,dy=b.y-p.y;if(Math.abs(dx)<p.w*.3&&Math.abs(dy)<p.h*.36){b.alive=false;dmgPl(1);}}
  // Enemy → player collision
  for(const e of en){if(!e.alive)continue;const dx=e.x-p.x,dy=e.y-p.y;if(Math.abs(dx)<(e.w+p.w)*.3&&Math.abs(dy)<(e.h+p.h)*.32){e.alive=false;waveRem--;dmgPl(2);spP(e.x,e.y,10,e.cl,.7);score+=e.sc;sesKills++;spFT(e.x,e.y,'碰撞!','#c41e3a');}}
  // Drops
  for(const d of drs){if(!d.alive)continue;d.y+=d.vy;if(d.y>H+30)d.alive=false;const dx=d.x-p.x,dy=d.y-p.y;if(Math.abs(dx)<d.w+p.w*.32&&Math.abs(dy)<d.h+p.h*.38){d.alive=false;colD(d);}}
  // Particles & floating texts
  for(const x of pts){x.x+=x.vx;x.y+=x.vy;x.vx*=.96;x.vy*=.96;x.life--;if(x.life<=0)x.alive=false;}
  for(const ft of fts){ft.y+=ft.vy;ft.life--;if(ft.life<=0)ft.alive=false;}
  // Screen shake
  if(shakeD>0){shakeX=(Math.random()-.5)*shakeD;shakeY=(Math.random()-.5)*shakeD;shakeD*=.85;if(shakeD<.3)shakeD=0;}else{shakeX=0;shakeY=0;}
  // Cleanup
  bul=bul.filter(b=>b.alive);eBul=eBul.filter(b=>b.alive);en=en.filter(e=>e.alive);pts=pts.filter(p=>p.alive);drs=drs.filter(d=>d.alive);fts=fts.filter(f=>f.alive);
  // Wave
  if(en.filter(e=>e.alive).length===0&&waveRem<=0){waveTm++;if(waveTm>65){if(gm==='stage'&&wave>=STAGES[gStage-1].w){stageClear();return;}wave++;$('h-mode').textContent=gm==='score'?'得分模式':'闯关·'+STAGES[gStage-1].n;spWave();}}
  upBg();upHUD();
}

// ═══ INPUT ═══════════════════════════════════
let ptr={active:false,x:W/2,y:H*.75};
function gPos(e){const r=C.getBoundingClientRect();const t=e.touches?e.touches[0]:e;return{x:t.clientX-r.left,y:t.clientY-r.top};}
C.addEventListener('touchstart',e=>{e.preventDefault();const p=gPos(e);ptr.active=true;ptr.x=p.x;ptr.y=p.y;},{passive:false});
C.addEventListener('touchmove',e=>{e.preventDefault();const p=gPos(e);ptr.x=p.x;ptr.y=p.y;},{passive:false});
C.addEventListener('touchend',e=>{e.preventDefault();ptr.active=false;},{passive:false});
C.addEventListener('mousedown',e=>{const p=gPos(e);ptr.active=true;ptr.x=p.x;ptr.y=p.y;});
C.addEventListener('mousemove',e=>{if(!ptr.active)return;const p=gPos(e);ptr.x=p.x;ptr.y=p.y;});
C.addEventListener('mouseup',()=>{ptr.active=false;});C.addEventListener('mouseleave',()=>{ptr.active=false;});

// ═══ RENDER ═════════════════════════════════
function draw(){
  cx.clearRect(0,0,W,H);
  cx.save();cx.translate(shakeX,shakeY);
  drBg();
  for(const d of drs){if(d.alive)drDp(d);}
  for(const e of en){if(e.alive)drEn(e);}
  for(const b of eBul){if(b.alive)drBu(b);}
  for(const b of bul){if(b.alive)drBu(b);}
  if(gs==='playing')drPl();
  drPts();drFTs();
  cx.restore();
}

// ═══ LOOP ═══════════════════════════════════
function loop(){rs();update();draw();requestAnimationFrame(loop);}

// ═══ INIT ═══════════════════════════════════
rfUI();pl=mkPl();initBg();loop();
// Start BGM on load (needs user interaction to actually play)
setTimeout(()=>{ia();userInteracted=true;if(SV.st.bgm)startBGM();},600);

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover,maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>苍穹仙途 · 水墨修真弹幕</title>
<style>
:root{--paper:#f5f0e4;--ink:#1a1a1a;--ink2:#555;--gold:#b8860b;--red:#c41e3a;--jade:#5a8a6a;--purple:#6a3a8a}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:var(--paper);touch-action:none;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;
  font-family:'STKaiti','KaiTi','STSong','Songti SC','Noto Serif SC',serif;}
#app{width:100%;height:100%;max-width:500px;max-height:920px;margin:0 auto;
  background:radial-gradient(ellipse at 50% 20%,#faf6ed,#ede3d0 45%,#d8ccb4 100%);
  box-shadow:0 0 80px rgba(0,0,0,.12);position:relative;overflow:hidden;display:flex;flex-direction:column;}
canvas{position:absolute;top:0;left:0;width:100%;height:100%;z-index:0;display:block;}

/* SCREENS */
.scr{position:absolute;top:0;left:0;right:0;bottom:0;z-index:5;display:flex;flex-direction:column;
  overflow-y:auto;pointer-events:none;opacity:0;transition:opacity .2s;}
.scr.show{z-index:10;pointer-events:all;opacity:1;}
.scr.none{display:none;}
.scr.pb{background:rgba(245,240,228,.96);}

/* TITLE */
.t4{font-size:46px;font-weight:bold;color:var(--ink);letter-spacing:8px;margin-bottom:4px;}
.t4 span{display:inline-block;animation:tf 2.5s ease-in-out infinite;}
.t4 span:nth-child(1){animation-delay:0s}.t4 span:nth-child(2){animation-delay:.12s}
.t4 span:nth-child(3){animation-delay:.24s}.t4 span:nth-child(4){animation-delay:.36s}
@keyframes tf{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
.sub{font-size:15px;color:var(--ink2);letter-spacing:6px;margin-bottom:4px;}
.divider{width:60px;height:1px;background:var(--ink);margin:14px auto 22px;opacity:.3;}
.btns{display:flex;flex-direction:column;gap:9px;width:200px;}
.btn{font-family:inherit;font-size:16px;font-weight:bold;padding:11px;border:1.5px solid var(--ink);
  background:transparent;color:var(--ink);letter-spacing:3px;cursor:pointer;border-radius:4px;transition:all .15s;}
.btn:active{background:var(--ink);color:var(--paper);}
.btn.ink{background:var(--ink);color:var(--paper);}
.btn.ink:active{background:var(--red);border-color:var(--red);}
.btn.gold{border-color:var(--gold);color:var(--gold);}
.btn.gold:active{background:var(--gold);color:var(--paper);}
.btn.sm{font-size:12px;padding:7px;}
.stones{display:flex;align-items:center;gap:6px;margin-top:18px;font-size:14px;color:var(--gold);letter-spacing:1px;}

/* HUD */
#hud{position:absolute;top:0;left:0;right:0;z-index:6;pointer-events:none;padding:10px 14px;}
#hud.off{display:none;}
.r{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:1px;}
.it{display:flex;flex-direction:column;}
.lb{font-size:10px;color:var(--ink2);letter-spacing:2px;}
.vl{font-size:21px;font-weight:bold;color:var(--ink);line-height:1.1;}
.vl.g{color:var(--gold);}
#pause-btn{position:absolute;top:10px;right:14px;z-index:7;pointer-events:all;
  font-family:inherit;font-size:20px;background:rgba(0,0,0,.08);border:none;width:36px;height:36px;
  border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--ink);}
#pause-btn.off{display:none;}
#pw-timer{position:absolute;top:44px;right:14px;z-index:7;pointer-events:none;
  font-size:13px;font-weight:bold;color:var(--red);letter-spacing:1px;}
#pw-timer.off{display:none;}
#combo{text-align:center;margin-top:2px;font-size:17px;font-weight:bold;opacity:0;transition:opacity .2s;}
#combo.on{opacity:1;}#combo.s{color:var(--gold);}#combo.ss{color:var(--red);animation:pls .5s infinite;}
@keyframes pls{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
#hp-w{position:absolute;bottom:14px;left:14px;right:14px;z-index:6;pointer-events:none;height:4px;background:rgba(0,0,0,.06);border-radius:2px;}
#hp-w.off{display:none;}
#hp-f{height:100%;background:var(--red);border-radius:2px;transition:width .3s;}
#qi-w{position:absolute;bottom:22px;left:14px;right:14px;z-index:6;pointer-events:none;height:3px;background:rgba(0,0,0,.04);border-radius:2px;}
#qi-w.off{display:none;}
#qi-f{height:100%;background:var(--gold);border-radius:2px;transition:width .3s;}
#nf-c{position:absolute;top:54px;left:50%;transform:translateX(-50%);z-index:20;pointer-events:none;display:flex;flex-direction:column;align-items:center;gap:7px;}
.nf{background:rgba(26,26,26,.92);color:var(--paper);padding:9px 18px;border-radius:6px;font-size:13px;letter-spacing:2px;animation:nfi .4s,nfo .4s 2s ease-in forwards;max-width:260px;text-align:center;}
.nf.g{border:1px solid var(--gold);}.nf.r{border:1px solid var(--red);}
@keyframes nfi{0%{opacity:0;transform:translateY(-18px)}100%{opacity:1;transform:translateY(0)}}
@keyframes nfo{0%{opacity:1}100%{opacity:0;transform:translateY(-10px)}}
.ph{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid rgba(0,0,0,.07);flex-shrink:0;}
.pt{font-size:20px;font-weight:bold;color:var(--ink);letter-spacing:4px;}
.pback{font-family:inherit;font-size:14px;background:none;border:none;color:var(--ink2);cursor:pointer;letter-spacing:2px;}
.pback:active{color:var(--ink);}
.pbd{padding:14px 18px;flex:1;overflow-y:auto;}
.stabs{display:flex;border-bottom:1px solid rgba(0,0,0,.07);flex-shrink:0;}
.stab{flex:1;font-family:inherit;font-size:13px;padding:9px;background:none;border:none;color:var(--ink2);cursor:pointer;letter-spacing:2px;}
.stab.on{color:var(--ink);font-weight:bold;border-bottom:2px solid var(--ink);}
.si{display:flex;align-items:center;justify-content:space-between;padding:13px 0;border-bottom:1px solid rgba(0,0,0,.04);flex-shrink:0;}
.sn{font-size:14px;font-weight:bold;color:var(--ink);}.sd{font-size:10px;color:var(--ink2);margin-top:1px;}
.sc{font-size:13px;color:var(--gold);font-weight:bold;margin-right:10px;white-space:nowrap;}
.sb{font-family:inherit;font-size:11px;padding:5px 12px;border:1px solid var(--gold);background:transparent;color:var(--gold);cursor:pointer;border-radius:3px;letter-spacing:1px;white-space:nowrap;}
.sb:active{background:var(--gold);color:#fff;}.sb.ok{color:var(--jade);border-color:var(--jade);}
.slv{font-size:10px;color:var(--ink2);margin-left:3px;}
.cg{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
.cc{border:1px solid rgba(0,0,0,.07);border-radius:8px;padding:12px 6px;text-align:center;transition:all .2s;}
.cc.lk{opacity:.4;filter:grayscale(1);}
.cc.own{border-color:var(--gold);background:rgba(184,134,11,.04);cursor:pointer;}
.cc.eq{border-color:var(--red);background:rgba(196,30,58,.05);}
.ci{font-size:34px;margin-bottom:5px;}.cn{font-size:11px;font-weight:bold;color:var(--ink);}.cd{font-size:9px;color:var(--ink2);margin-top:1px;}
.ai{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid rgba(0,0,0,.04);flex-shrink:0;}
.ai.lk{opacity:.4;filter:grayscale(1);}
.aico{font-size:26px;min-width:32px;text-align:center;}
.an{font-size:13px;font-weight:bold;color:var(--ink);}.ad{font-size:10px;color:var(--ink2);}.arw{font-size:11px;color:var(--gold);}
.lbtabs{display:flex;border-bottom:1px solid rgba(0,0,0,.07);flex-shrink:0;}
.lbtab{flex:1;font-family:inherit;font-size:12px;padding:8px;background:none;border:none;color:var(--ink2);cursor:pointer;letter-spacing:1px;}
.lbtab.on{color:var(--ink);font-weight:bold;border-bottom:2px solid var(--ink);}
.lbi{display:flex;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid rgba(0,0,0,.03);}
.lbr{font-size:15px;font-weight:bold;width:26px;text-align:center;}.lbr.top{color:var(--gold);}
.lbs{font-size:17px;font-weight:bold;color:var(--ink);flex:1;text-align:right;}.lbd{font-size:9px;color:var(--ink2);}
.sr{display:flex;align-items:center;justify-content:space-between;padding:13px 0;border-bottom:1px solid rgba(0,0,0,.04);}
.sl{font-size:14px;color:var(--ink);}.sld{font-size:10px;color:var(--ink2);}
.tg{width:48px;height:26px;background:#ccc;border-radius:13px;position:relative;cursor:pointer;transition:background .2s;flex-shrink:0;}
.tg.on{background:var(--jade);}
.tg::after{content:'';position:absolute;top:2px;left:2px;width:22px;height:22px;background:#fff;border-radius:50%;transition:left .2s;box-shadow:0 1px 3px rgba(0,0,0,.2);}
.tg.on::after{left:24px;}
.dbtn{font-family:inherit;font-size:12px;padding:7px 14px;border:1px solid var(--red);background:transparent;color:var(--red);cursor:pointer;border-radius:4px;letter-spacing:1px;}
.dbtn:active{background:var(--red);color:#fff;}
.rbox{text-align:center;padding:16px;width:100%;}
.rt{font-size:30px;font-weight:bold;letter-spacing:6px;color:var(--ink);}.rt.w{color:var(--gold);}
.rs{font-size:52px;font-weight:bold;color:var(--ink);margin:6px 0;}
.rstats{display:flex;justify-content:center;gap:20px;margin:14px 0;flex-wrap:wrap;}
.rst{text-align:center;}.rstv{font-size:18px;font-weight:bold;color:var(--gold);}.rstl{font-size:10px;color:var(--ink2);}
.rss{font-size:17px;color:var(--gold);margin:6px 0;font-weight:bold;}
.rbtns{display:flex;flex-direction:column;gap:9px;align-items:center;margin-top:14px;}
#pause-ol{position:absolute;top:0;left:0;right:0;bottom:0;z-index:8;background:rgba(245,240,228,.85);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;}
#pause-ol.hidden{display:none;}
.pause-tt{font-size:28px;font-weight:bold;color:var(--ink);letter-spacing:6px;margin-bottom:10px;}
.toast{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:30;font-size:56px;pointer-events:none;animation:tp .8s ease-out forwards;}
@keyframes tp{0%{opacity:0;transform:translate(-50%,-50%) scale(.3)}30%{opacity:1;transform:translate(-50%,-50%) scale(1.2)}100%{opacity:0;transform:translate(-50%,-50%) scale(1.5)}}
@media(max-width:380px){.t4{font-size:36px}.btn{font-size:14px;padding:10px}.rs{font-size:40px}}
</style>
</head>
<body>
<div id="app">
<canvas id="c"></canvas>

<div id="hud" class="off">
  <div class="r"><div class="it"><span class="lb">得分</span><span class="vl" id="h-score">0</span></div><div class="it" style="align-items:flex-end"><span class="lb" id="h-mode">闯关</span><span class="vl g" id="h-wave">第1波</span></div></div>
  <div class="r"><div class="it"><span class="lb">灵石</span><span class="vl g" id="h-stones">+0</span></div><div class="it" style="align-items:flex-end"><span class="lb">击杀</span><span class="vl" id="h-kills">0</span></div></div>
  <div id="combo"></div>
</div>
<button id="pause-btn" class="off" data-action="pause">⏸</button>
<div id="pw-timer" class="off"></div>
<div id="hp-w" class="off"><div id="hp-f" style="width:100%"></div></div>
<div id="qi-w" class="off"><div id="qi-f" style="width:0%"></div></div>
<div id="nf-c"></div>

<div id="pause-ol" class="hidden">
  <div class="pause-tt">暂停</div>
  <button class="btn ink" data-action="resume">继续</button>
  <button class="btn" data-action="restart">重来</button>
  <button class="btn" data-action="home">回主页</button>
</div>

<div class="scr show pb" id="titlescr" style="justify-content:center;align-items:center;text-align:center;">
  <div style="flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;">
    <div class="t4"><span>苍</span><span>穹</span><span>仙</span><span>途</span></div>
    <div class="sub">CULTIVATION SKY</div>
    <div class="divider"></div>
    <div class="btns">
      <button class="btn ink" data-action="stage">⚔️ 闯关模式</button>
      <button class="btn" data-action="score">🏆 得分模式</button>
      <button class="btn gold" data-action="shop">🏪 仙坊</button>
      <button class="btn" data-action="collection">📜 法宝图鉴</button>
      <button class="btn" data-action="achievements">🎖 成就</button>
      <button class="btn" data-action="leaderboard">📊 排行榜</button>
      <button class="btn sm" data-action="settings">⚙️ 设置</button>
    </div>
    <div class="stones">💎 <span id="t-stones">0</span> 灵石</div>
  </div>
</div>

<div class="scr none pb" id="shopscr">
  <div class="ph"><button class="pback" data-action="back">← 返回</button><span class="pt">仙坊</span><span style="color:var(--gold);font-size:13px">💎 <span id="s-stones">0</span></span></div>
  <div class="stabs"><button class="stab on" data-tab="upgrade">修为提升</button><button class="stab" data-tab="artifact">法宝购买</button></div>
  <div class="pbd" id="shop-list"></div>
</div>

<div class="scr none pb" id="collectionscr">
  <div class="ph"><button class="pback" data-action="back">← 返回</button><span class="pt">法宝图鉴</span><span style="font-size:11px;color:var(--ink2)" id="cc-count"></span></div>
  <div class="pbd"><div class="cg" id="coll-grid"></div></div>
</div>

<div class="scr none pb" id="achievementsscr">
  <div class="ph"><button class="pback" data-action="back">← 返回</button><span class="pt">成就</span><span style="font-size:11px;color:var(--ink2)" id="ac-count"></span></div>
  <div class="pbd" id="ac-list"></div>
</div>

<div class="scr none pb" id="leaderboardscr">
  <div class="ph"><button class="pback" data-action="back">← 返回</button><span class="pt">排行榜</span></div>
  <div class="lbtabs"><button class="lbtab on" data-mode="score">得分模式</button><button class="lbtab" data-mode="stage">闯关模式</button></div>
  <div class="pbd"><div id="lb-list"></div></div>
</div>

<div class="scr none pb" id="settingsscr">
  <div class="ph"><button class="pback" data-action="back">← 返回</button><span class="pt">设置</span></div>
  <div class="pbd">
    <div class="sr"><div><div class="sl">🔊 音效</div><div class="sld">所有游戏音效</div></div><div class="tg on" id="tg-sfx" data-key="sfx"></div></div>
    <div class="sr"><div><div class="sl">🎵 背景音乐</div><div class="sld">五声音阶修仙BGM</div></div><div class="tg on" id="tg-bgm" data-key="bgm"></div></div>
    <div class="sr"><div><div class="sl">💾 数据</div><div class="sld">自动存至浏览器</div></div><span style="font-size:10px;color:var(--jade)">✓ 已启用</span></div>
    <div class="sr"><div><div class="sl">🗑️ 清除</div><div class="sld">重置全部进度</div></div><button class="dbtn" id="btn-clear">清除</button></div>
    <div style="text-align:center;margin-top:22px;font-size:10px;color:var(--ink2)">🖌️ 水墨修真 · v5</div>
  </div>
</div>

<div class="scr none" id="goscr" style="background:rgba(245,240,228,.92);justify-content:center;align-items:center;">
  <div class="rbox">
    <div class="rt" id="go-title">修士陨落</div><div style="font-size:13px;color:var(--ink2);margin-top:4px">最终得分</div>
    <div class="rs" id="go-score">0</div>
    <div class="rstats"><div class="rst"><div class="rstv" id="go-kills">0</div><div class="rstl">击杀</div></div><div class="rst"><div class="rstv" id="go-combo">0</div><div class="rstl">最高连击</div></div><div class="rst"><div class="rstv" id="go-wave">0</div><div class="rstl">波次</div></div></div>
    <div class="rss" id="go-stones">💎 +0 灵石</div>
    <div class="rbtns"><button class="btn ink" data-action="retry">再战</button><button class="btn" data-action="home">返回</button></div>
  </div>
</div>

<div class="scr none" id="scscr" style="background:rgba(245,240,228,.92);justify-content:center;align-items:center;">
  <div class="rbox">
    <div class="rt w">道心突破</div><div style="font-size:15px;color:var(--ink);margin-top:4px" id="sc-name"></div>
    <div class="rs" style="font-size:36px;color:var(--gold)" id="sc-score">通关！</div>
    <div class="rstats"><div class="rst"><div class="rstv" id="sc-kills">0</div><div class="rstl">击杀</div></div><div class="rst"><div class="rstv" id="sc-combo">0</div><div class="rstl">最高连击</div></div><div class="rst"><div class="rstv" id="sc-hp">0</div><div class="rstl">剩余生命</div></div></div>
    <div class="rss" id="sc-stones">💎 +0 灵石</div>
    <div class="rbtns"><button class="btn ink" data-action="nextstage">下一关</button><button class="btn" data-action="home">返回</button></div>
  </div>
</div>
</div>

<script>
// ═══════════════════════════════════════════════
//  苍穹仙途 v5 · Ink Cultivation Sky Shooter
// ═══════════════════════════════════════════════
const $=id=>document.getElementById(id);
const C=$('c'),cx=C.getContext('2d');
let W,H,DPR;
function rs(){
  const r=$('app').getBoundingClientRect();W=r.width;H=r.height;
  DPR=Math.min(window.devicePixelRatio||1,2);
  C.width=W*DPR;C.height=H*DPR;cx.setTransform(DPR,0,0,DPR,0,0);
}
window.addEventListener('resize',rs);rs();

// ═══ DATA ════════════════════════════════════
const STAGES=[
  {n:'炼气期',w:5,bh:20,us:0},{n:'筑基期',w:7,bh:35,us:0},{n:'金丹期',w:9,bh:55,us:0},
  {n:'元婴期',w:11,bh:80,us:500},{n:'化神期',w:13,bh:120,us:1500},
  {n:'炼虚期',w:15,bh:170,us:4000},{n:'合体期',w:17,bh:240,us:8000},
  {n:'大乘期',w:20,bh:330,us:15000},{n:'渡劫飞升',w:25,bh:500,us:30000},
];
const COMBO=[
  {m:0,n:'初学乍练',c:'#8a8a8a'},{m:5,n:'小有所成',c:'#6a8a6a'},{m:10,n:'炉火纯青',c:'#4a8a4a'},
  {m:20,n:'融会贯通',c:'#2a7a2a'},{m:35,n:'登峰造极',c:'#b8860b'},{m:50,n:'举世无双',c:'#daa520'},
  {m:75,n:'天人合一',c:'#c41e3a'},{m:100,n:'破碎虚空',c:'#8a3a8a'},
];
const ARTS=[
  {id:'s1',n:'青釭剑',icon:'🗡️',d:'入门飞剑，灵动飘逸',ul:'初始拥有',pj:'normal',bon:null,swordCl:'#6a8a8a'},
  {id:'s2',n:'紫电剑',icon:'⚡',d:'剑出紫电，射速提升',ul:'击杀500敌',pj:'rapid',bon:{t:'fireRate',v:3},swordCl:'#8a6acc'},
  {id:'s3',n:'玄铁重剑',icon:'🗿',d:'重剑无锋大巧不工',ul:'击杀1500敌',pj:'big',bon:{t:'damage',v:2},swordCl:'#3a3a3a'},
  {id:'s4',n:'碧玉飞刀',icon:'🔪',d:'碧绿飞刀散射周天',ul:'仙坊·2000灵石',pj:'spread',bon:{t:'spread',v:1},swordCl:'#5a8a5a'},
  {id:'s5',n:'天罡剑阵',icon:'✨',d:'三十六天罡剑气',ul:'通关金丹期',pj:'array',bon:{t:'fireRate',v:5},swordCl:'#4a8aca'},
  {id:'s6',n:'太乙拂尘',icon:'🌿',d:'道门至宝灵气护体',ul:'仙坊·5000灵石',pj:'homing',bon:{t:'heal',v:2},swordCl:'#8a8a5a'},
  {id:'s7',n:'诛仙剑',icon:'💫',d:'通天教主镇教之宝',ul:'击杀5000敌',pj:'ultra',bon:{t:'all',v:3},swordCl:'#c41e3a'},
];
const ACH=[
  {id:'a1',n:'初入仙途',d:'第一场战斗',icon:'🌟',rw:50,ch:s=>s.tg>=1},
  {id:'a2',n:'屠妖新手',d:'累计击杀100',icon:'⚔️',rw:200,ch:s=>s.tk>=100},

function p(f,d,t='sine',v=0.15,ff=null,fe=null){
  if(!AC||!SV.st.sfx)return;
  try{const o=AC.createOscillator(),g=AC.createGain(),tm=AC.currentTime;o.type=t;o.frequency.setValueAtTime(f,tm);if(ff)o.frequency.linearRampToValueAtTime(ff,tm+d*.3);if(fe)o.frequency.linearRampToValueAtTime(fe,tm+d);g.gain.setValueAtTime(Math.min(v,.25),tm);g.gain.exponentialRampToValueAtTime(.001,tm+d);o.connect(g);g.connect(AC.destination);o.start(tm);o.stop(tm+d);}catch(e){}
}

// ─── BGM ────────────────────────────────────
let bgmN=[],bgmG=null,bgmOn=false;
function startBGM(){
  if(!AC||bgmOn)return;
  if(!SV.st.bgm)return;
  bgmOn=true;
  try{
    bgmG=AC.createGain();bgmG.gain.setValueAtTime(.08,AC.currentTime);bgmG.connect(AC.destination);
    const notes=[262,294,330,392,440,524,588,660,784,880];let ni=0;
    function sn(){
      if(!bgmOn)return;const f=notes[ni%notes.length],tm=AC.currentTime;
      const o=AC.createOscillator(),g=AC.createGain();o.type='sine';o.frequency.setValueAtTime(f,tm);
      g.gain.setValueAtTime(0,tm);g.gain.linearRampToValueAtTime(.05,tm+.9);g.gain.linearRampToValueAtTime(.015,tm+3.5);g.gain.linearRampToValueAtTime(0,tm+4.2);
      o.connect(g);g.connect(bgmG);o.start();o.stop(tm+4.7);bgmN.push(o,g);
      ni=(ni+1+Math.floor(Math.random()*3))%notes.length;setTimeout(sn,3600+Math.random()*2000);
    }
    sn();
  }catch(e){}
}
function stopBGM(){bgmOn=false;for(const n of bgmN){try{n.stop()}catch(e){}}bgmN=[];if(bgmG)bgmG.disconnect();bgmG=null;}

}

function drBg(){
  cx.fillStyle='rgba(245,240,228,.1)';cx.fillRect(0,0,W,H);

function plShoot(){
  const p=pl;p.sTimer--;if(p.sTimer>0)return;
  const iv=p.pu==='rapid'?3:p.sInt;p.sTimer=iv;
  const bx=p.x,by=p.y-p.h*.45,dmg=p.dmg,bs=p.bspd,art=p.art;
  if(art.pj==='spread'||p.pu==='spread'){bul.push(mkB(bx,by,0,-bs,dmg));bul.push(mkB(bx,by,-1.6,-bs*.88,dmg));bul.push(mkB(bx,by,1.6,-bs*.88,dmg));}
  else if(art.pj==='big'||p.pu==='big'){bul.push(mkB(bx,by,0,-bs*.78,dmg*3,'#c41e3a','big'));bul.push(mkB(bx-3,by+2,0,-bs*.82,dmg,'#c41e3a'));bul.push(mkB(bx+3,by+2,0,-bs*.82,dmg,'#c41e3a'));}
  else if(art.pj==='ultra'){bul.push(mkB(bx,by,0,-bs,dmg*2,'#8a3a8a','big'));bul.push(mkB(bx,by,-2,-bs*.82,dmg,'#8a3a8a'));bul.push(mkB(bx,by,2,-bs*.82,dmg,'#8a3a8a'));bul.push(mkB(bx,by,-1,-bs*.9,dmg,'#6a2a6a'));bul.push(mkB(bx,by,1,-bs*.9,dmg,'#6a2a6a'));}
  else if(art.pj==='homing'){bul.push(mkB(bx,by,0,-bs,dmg,'#5a8a5a'));bul.push(mkB(bx,by,-.5,-bs*.93,dmg,'#5a8a5a'));bul.push(mkB(bx,by,.5,-bs*.93,dmg,'#5a8a5a'));}
  else if(art.pj==='array'){const n=3;for(let i=0;i<n;i++){const a=-.3+i*.3/(n-1);bul.push(mkB(bx,by,a*3.5,-bs,dmg,'#4a6a8a'));}}
  else bul.push(mkB(bx,by,0,-bs,dmg));
  SFX.shoot();
}

  e.alive=false;waveRem--;sesKills++;combo++;mCombo=Math.max(mCombo,combo);kdc++;score+=e.sc*(1+Math.floor(combo/15));SFX.combo();upCombo();

}

  if(gm==='score'){SV.lbScore.push({score,kills:sesKills,wave,combo:mCombo,dt});SV.lbScore.sort((a,b)=>b.score-a.score);SV.lbScore=SV.lbScore.slice(0,10);}
  else{SV.lbStage.push({stage:gStage,score,kills:sesKills,dt});SV.lbStage.sort((a,b)=>b.stage-b.stage||b.score-a.score);SV.lbStage=SV.lbStage.slice(0,10);}
  ckAch();ps();$('go-title').textContent='修士陨落';$('go-title').classList.remove('w');$('go-score').textContent=score;$('go-kills').textContent=sesKills;$('go-combo').textContent=mCombo;$('go-wave').textContent=wave;$('go-stones').textContent='💎 +'+sesStones+' 灵石';
  $('hud').classList.add('off');$('pause-btn').classList.add('off');$('pw-timer').classList.add('off');$('hp-w').classList.add('off');$('qi-w').classList.add('off');
  document.querySelectorAll('#goscr,#scscr').forEach(s=>{s.classList.remove('show');s.classList.add('none');});
  $('#goscr').classList.remove('none');$('#goscr').classList.add('show');
}
function stageClear(){
  gs='stageclear';pl.pu=null;pl.puTimer=0;SV.tg++;SV.tk+=sesKills;SV.tse+=sesStones;SV.ss+=sesStones;SV.bs=Math.max(SV.bs,score);SV.bc=Math.max(SV.bc,mCombo);if(!sesDmg)SV.ndc++;SV.ms=Math.max(SV.ms,gStage);
  const dt=new Date().toLocaleDateString('zh-CN');SV.lbStage.push({stage:gStage,score,kills:sesKills,dt});SV.lbStage.sort((a,b)=>b.stage-b.stage||b.score-a.score);SV.lbStage=SV.lbStage.slice(0,10);
  ckAch();ps();SFX.stageClear();const si=STAGES[gStage-1];$('sc-name').textContent='踏入 '+si.n;$('sc-score').textContent='通关！';$('sc-kills').textContent=sesKills;$('sc-combo').textContent=mCombo;$('sc-hp').textContent=pl.hp+'/'+pl.mhp;$('sc-stones').textContent='💎 +'+sesStones+' 灵石';
  const ns=STAGES[gStage];const nb=document.querySelector('[data-action=nextstage]');
  if(ns&&SV.ss>=ns.us){nb.style.display='';nb.textContent=`下一关·${ns.n}`;}
  else if(ns){nb.style.display='';nb.textContent=`${ns.n} (需${ns.us}💎解锁)`;}
  else{nb.style.display='none';}
  $('hud').classList.add('off');$('pause-btn').classList.add('off');$('pw-timer').classList.add('off');$('hp-w').classList.add('off');$('qi-w').classList.add('off');
  document.querySelectorAll('#goscr,#scscr').forEach(s=>{s.classList.remove('show');s.classList.add('none');});
  $('#scscr').classList.remove('none');$('#scscr').classList.add('show');toast('🌟');
}
function advSt(){const ns=STAGES[gStage];if(ns&&SV.ss>=ns.us){$('#scscr').classList.add('none');gStage++;wave=1;score+=500;sesStones=0;sesKills=0;mCombo=0;combo=0;sesDmg=false;kdc=0;fc=0;pl=mkPl();bul=[];eBul=[];en=[];pts=[];drs=[];fts=[];initBg();gsHide();$('hud').classList.remove('off');$('pause-btn').classList.remove('off');$('hp-w').classList.remove('off');$('qi-w').classList.remove('off');$('h-mode').textContent='闯关·'+STAGES[gStage-1].n;$('h-wave').textContent='第1波';upHUD();spWave();gs='playing';}else nf('灵石不足或已通关','r');}
function pauseGame(){if(gs!=='playing')return;gs='paused';$('pause-ol').classList.remove('hidden');}

// ═══ HUD ═══════════════════════════════════
function upHUD(){$('h-score').textContent=score;$('h-wave').textContent=gm==='stage'?'第'+wave+'/'+STAGES[gStage-1].w+'波':'第'+wave+'波';$('h-stones').textContent='+'+sesStones;$('h-kills').textContent=sesKills;$('hp-f').style.width=(pl.hp/pl.mhp*100)+'%';$('qi-f').style.width=(pl.qi/pl.qiMax*100)+'%';if(pl.puTimer>0&&pl.pu){const sec=Math.ceil(pl.puTimer/60);$('pw-timer').classList.remove('off');$('pw-timer').textContent=pl.pu+' '+sec+'s';}else{$('pw-timer').classList.add('off');}}

// ═══ UPDATE ════════════════════════════════
function update(){
  if(gs!=='playing')return;fc++;const p=pl;
  if(ptr.active){const dx=ptr.x-p.x,dy=ptr.y-p.y,dist=Math.sqrt(dx*dx+dy*dy);if(dist>1){const ms=Math.min(p.spd,dist);p.x+=dx/dist*ms;p.y+=dy/dist*ms*.75;}}
  p.x=Math.max(p.w/2,Math.min(W-p.w/2,p.x));p.y=Math.max(p.h/2,Math.min(H-p.h/2,p.y));
  if(p.inv>0)p.inv--;if(p.puTimer>0){p.puTimer--;if(p.puTimer<=0)p.pu=null;}plShoot();
  for(const b of bul){b.x+=b.vx;b.y+=b.vy;if(b.y<-20||b.y>H+20||b.x<-20||b.x>W+20)b.alive=false;}
  for(const b of eBul){b.x+=b.vx;b.y+=b.vy;if(b.y<-20||b.y>H+20||b.x<-20||b.x>W+20)b.alive=false;}
  for(const e of en){if(!e.alive)continue;e.y+=e.spd;e.wb+=e.wbSp;e.x+=Math.sin(e.wb)*e.wbAmp;e.x=Math.max(e.w/2,Math.min(W-e.w/2,e.x));if(e.fl>0)e.fl--;if(e.sht)enShoot(e);if(e.y>H+e.h){e.alive=false;waveRem--;if(!e.boss)dmgPl(1);}}
  for(const b of bul){if(!b.alive)continue;for(const e of en){if(!e.alive)continue;const dx=b.x-e.x,dy=b.y-e.y;if(Math.abs(dx)<e.w*.4&&Math.abs(dy)<e.h*.4){b.alive=false;e.hp-=b.dmg;e.fl=4;spP(b.x,b.y,2,'rgba(60,60,60,1)',.2);if(e.hp<=0)killEn(e);else SFX.hit();}}}
  for(const b of eBul){if(!b.alive)continue;const dx=b.x-p.x,dy=b.y-p.y;if(Math.abs(dx)<p.w*.28&&Math.abs(dy)<p.h*.34){b.alive=false;dmgPl(1);}}
  for(const e of en){if(!e.alive)continue;const dx=e.x-p.x,dy=e.y-p.y;if(Math.abs(dx)<(e.w+p.w)*.28&&Math.abs(dy)<(e.h+p.h)*.3){e.alive=false;waveRem--;dmgPl(2);spP(e.x,e.y,9,e.cl,.6);score+=e.sc;sesKills++;spFT(e.x,e.y,'碰撞!','#c41e3a');}}
  for(const d of drs){if(!d.alive)continue;d.y+=d.vy;if(d.y>H+30)d.alive=false;const dx=d.x-p.x,dy=d.y-p.y;if(Math.abs(dx)<d.w+p.w*.3&&Math.abs(dy)<d.h+p.h*.36){d.alive=false;colD(d);}}
  for(const x of pts){x.x+=x.vx;x.y+=x.vy;x.vx*=.96;x.vy*=.96;x.life--;if(x.life<=0)x.alive=false;}
  for(const ft of fts){ft.y+=ft.vy;ft.life--;if(ft.life<=0)ft.alive=false;}
  if(shkD>0){shkX=(Math.random()-.5)*shkD;shkY=(Math.random()-.5)*shkD;shkD*=.84;if(shkD<.25)shkD=0;}else{shkX=0;shkY=0;}
  bul=bul.filter(b=>b.alive);eBul=eBul.filter(b=>b.alive);en=en.filter(e=>e.alive);pts=pts.filter(p=>p.alive);drs=drs.filter(d=>d.alive);fts=fts.filter(f=>f.alive);
  if(en.filter(e=>e.alive).length===0&&waveRem<=0){waveTm++;if(waveTm>60){if(gm==='stage'&&wave>=STAGES[gStage-1].w){stageClear();return;}wave++;$('h-mode').textContent=gm==='score'?'得分模式':'闯关·'+STAGES[gStage-1].n;spWave();}}
  upBg();upHUD();
}

// ═══ INPUT ═══════════════════════════════════
let ptr={active:false,x:W/2,y:H*.75};
function gPos(e){const r=C.getBoundingClientRect();const t=e.touches?e.touches[0]:e;return{x:t.clientX-r.left,y:t.clientY-r.top};}
C.addEventListener('touchstart',e=>{e.preventDefault();const p=gPos(e);ptr.active=true;ptr.x=p.x;ptr.y=p.y;},{passive:false});
C.addEventListener('touchmove',e=>{e.preventDefault();const p=gPos(e);ptr.x=p.x;ptr.y=p.y;},{passive:false});
C.addEventListener('touchend',e=>{e.preventDefault();ptr.active=false;},{passive:false});
C.addEventListener('mousedown',e=>{const p=gPos(e);ptr.active=true;ptr.x=p.x;ptr.y=p.y;});
C.addEventListener('mousemove',e=>{if(!ptr.active)return;const p=gPos(e);ptr.x=p.x;ptr.y=p.y;});
C.addEventListener('mouseup',()=>{ptr.active=false;});C.addEventListener('mouseleave',()=>{ptr.active=false;});

// ═══ RENDER ═════════════════════════════════
function draw(){
  cx.clearRect(0,0,W,H);cx.save();cx.translate(shkX,shkY);drBg();
  for(const d of drs){if(d.alive)drDp(d);}for(const e of en){if(e.alive)drEn(e);}
  for(const b of eBul){if(b.alive)drBu(b);}for(const b of bul){if(b.alive)drBu(b);}
  if(gs==='playing')drPl();drPts();drFTs();cx.restore();
}
function loop(){rs();update();draw();requestAnimationFrame(loop);}

// ═══ INIT ═══════════════════════════════════
rfUI();pl=mkPl();initBg();loop();
// Try to start BGM immediately (works on desktop, mobile needs touch)
ia();startBGM();
console.log('🌌 苍穹仙途 v5');
console.log('🔊 音量已加大 | 🎵 进入即BGM | 👤 新角色造型');
console.log('👹 敌方小于主角 | 👿 Boss单独出战 | 💎 每5杀必掉');
</script>
